<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>QR 구역 2 · 졸업영상 촬영 기록</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0e1118;font-family:system-ui,'Malgun Gothic',sans-serif;color:white}body{display:grid;place-items:center;overflow:hidden}.shell{width:min(100vw,calc((100dvh - 104px)*16/9));max-width:100vw;display:flex;flex-direction:column;align-items:stretch;min-width:0}.top-strip{height:48px;min-height:48px;display:flex;align-items:center;justify-content:center;background:#0e1118;padding:3px 7px}.bottom-strip{height:56px;min-height:56px;display:flex;align-items:center;justify-content:center;background:#0e1118}.stage{width:100%;aspect-ratio:16/9;position:relative;background:#111;overflow:hidden;isolation:isolate}.picture{position:absolute;inset:0;overflow:hidden}.picture img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:center;transition:opacity 1.35s ease,transform 1.7s cubic-bezier(.18,.71,.22,1),filter 1.6s ease;will-change:transform,filter,opacity}.wide{filter:blur(3.5px) brightness(.87);transform:scale(1.035)}.close{opacity:0;filter:blur(4px);transform:scale(1.045)}.stage.zoomed .wide{opacity:0;transform:scale(1.19);filter:blur(2px)}.stage.zoomed .close{opacity:1;filter:blur(0);transform:scale(1)}.recording{position:absolute;inset:0;pointer-events:none;z-index:3}.bracket{position:absolute;width:8.5%;height:13%;border-color:#f4f8fa;border-style:solid;filter:drop-shadow(0 1px 2px #0009)}.tl{top:3%;left:2.5%;border-width:3px 0 0 3px}.tr{top:3%;right:2.5%;border-width:3px 3px 0 0}.bl{bottom:3%;left:2.5%;border-width:0 0 3px 3px}.br{bottom:3%;right:2.5%;border-width:0 3px 3px 0}.rec{position:absolute;left:5.2%;top:5.2%;font-weight:800;font-size:clamp(15px,2.8vw,29px);letter-spacing:.025em;text-shadow:0 2px 5px #000c;display:flex;gap:10px;align-items:center}.dot{width:clamp(10px,1.5vw,17px);aspect-ratio:1;border-radius:50%;background:#ff343a;box-shadow:0 0 7px #ff343a;animation:blink 1.5s infinite}@keyframes blink{50%{opacity:.35}}.time{position:absolute;right:5.2%;top:5%;font:700 clamp(15px,2.65vw,30px)/1.1 'Consolas','Courier New',monospace;letter-spacing:.07em;text-shadow:0 2px 6px #000,0 0 5px #000b;white-space:nowrap;font-variant-numeric:tabular-nums}.controls{position:relative;z-index:5;display:flex;align-items:center;justify-content:center}.mainbtn{font:800 clamp(15px,1.85vw,21px) system-ui,sans-serif;color:white;border:2px solid #ffffffca;border-radius:50px;min-width:clamp(108px,14vw,155px);min-height:clamp(36px,3.4vw,43px);padding:.55em 1em;background:#142235de;box-shadow:0 0 15px #0009,0 0 10px #3a95ff66;cursor:pointer;touch-action:manipulation}.mainbtn:hover{background:#234268}.mainbtn:focus-visible{outline:3px solid #8fc6ff;outline-offset:3px}.hint{position:absolute;bottom:15%;left:50%;transform:translateX(-50%);text-align:center;color:#fff;text-shadow:0 1px 5px #000,0 0 6px #000;z-index:4;font-weight:600;font-size:clamp(11px,1.3vw,16px);pointer-events:none;white-space:nowrap}.stage.zoomed .hint{display:none}.end{display:none;position:absolute;inset:0;z-index:10;background:#0e151bc9;backdrop-filter:blur(8px);place-items:center;text-align:center;padding:30px}.end.open{display:grid}.end h2{font-size:clamp(22px,3vw,42px);margin:0 0 12px}.end p{font-size:clamp(14px,1.6vw,22px);color:#e8edf3;line-height:1.6}.end button{font:inherit;font-size:clamp(14px,1.6vw,20px);background:#f7e3b9;color:#25231f;border:0;border-radius:12px;padding:.7em 2em;cursor:pointer}.stage.completed .recording{display:none}.stage.completed .controls,.stage.completed .hint{display:none}@media(max-aspect-ratio:9/8){.stage{width:100vw;height:100dvh;aspect-ratio:auto}.picture img{object-fit:cover}.rec{font-size:clamp(15px,3.8vw,24px);left:7%;top:6%}.time{font-size:clamp(13px,3.5vw,21px);right:7%;top:6%}.controls{bottom:8%}.hint{bottom:19%;white-space:normal;width:80%}.bracket{width:12%;height:9%}}@media(prefers-reduced-motion:reduce){.picture img{transition:none}.dot{animation:none}}
.video-caption{position:absolute;z-index:6;left:21%;top:2.5%;width:55%;max-width:55%;text-align:center;padding:.35em .65em;color:#fff;background:rgba(9,14,22,.77);border-radius:8px;box-shadow:0 3px 15px #0007;font-size:clamp(15px,2.18vw,23px);font-weight:750;line-height:1.46;letter-spacing:-.02em;text-shadow:0 1px 2px #0009;word-break:keep-all;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease,visibility .35s ease;pointer-events:none}.video-caption.visible{opacity:1;visibility:visible;transform:translateY(0)}.stage.completed .video-caption{display:none}@media(max-aspect-ratio:9/8){.video-caption{left:19%;top:2%;width:61%;max-width:61%;font-size:clamp(12px,2.4vw,19px)}}@media(prefers-reduced-motion:reduce){.video-caption{transition:none}}
@media(max-aspect-ratio:9/8){.shell{width:100vw}.stage{width:100%;height:auto;aspect-ratio:16/9}.controls{bottom:auto}.top-strip{height:60px;min-height:60px;padding:4px 10px}.bottom-strip{height:60px;min-height:60px}.video-caption{font-size:clamp(13px,2.6vw,20px)}.bracket{width:12%;height:12%}}
@media(max-height:550px){.shell{width:min(100vw,calc((100dvh - 76px)*16/9))}.top-strip{height:36px;min-height:36px}.bottom-strip{height:40px;min-height:40px}.mainbtn{min-height:32px;font-size:14px}.video-caption{font-size:clamp(11px,1.9vw,16px)}}
.controls.is-hidden{visibility:hidden;pointer-events:none}
</style></head><body><div class="shell"><div class="top-strip"></div><main class="stage" id="stage" aria-label="졸업영상 촬영 기록을 확대해 관찰하는 화면"><div class="video-caption" id="caption" aria-live="polite">아, 졸업영상인데 얼굴이 안 보이잖아.<br>민준이, 서연이! 카메라 봐봐!</div><div class="picture"><img class="wide" src="assets/wide.webp" alt="교실 전체, 기침하는 민준과 뒷모습의 서연"><img class="close" src="assets/close.webp" alt="민준과 서연을 확대하고 책상 위 처방약봉투를 선명하게 보여주는 장면"></div><div class="recording" aria-label="녹화 중, 오전 8시 45분 1초"><i class="bracket tl"></i><i class="bracket tr"></i><i class="bracket bl"></i><i class="bracket br"></i><div class="rec"><span class="dot"></span> REC</div><div class="time">AM 08:45:01</div></div><div class="hint" id="hint">줌 버튼을 눌러 장면을 자세히 관찰하세요</div><section class="end" id="end" aria-live="polite"><div><h2>조사 완료</h2><p>관찰한 사실과 시각을 수사수첩에 기록해 주세요.<br>이 장면에서는 정답을 알려주지 않습니다.</p><button id="replay" type="button">다시 보기</button></div></section></main><div class="bottom-strip"><div class="controls" id="controls"><button class="mainbtn" id="zoom" type="button">⌕ 줌 +</button></div></div></div><script>
const stage=document.getElementById('stage');
const btn=document.getElementById('zoom');
const end=document.getElementById('end');
const caption=document.getElementById('caption');
const controls=document.getElementById('controls');
let zoomed=false, captionShowTimer=null, captionHideTimer=null, completeBtnTimer=null;
function clearCaption(){
  clearTimeout(captionShowTimer);clearTimeout(captionHideTimer);clearTimeout(completeBtnTimer);
  caption.classList.remove('visible');
}
btn.addEventListener('click',()=>{
 if(!zoomed){
  zoomed=true;
  stage.classList.add('zoomed');
  controls.classList.add('is-hidden');
  clearCaption();
  // 줌 전환이 끝난 다음 자막이 나타나고, 자막이 사라진 후에만 조사 완료 버튼 노출
  captionShowTimer=setTimeout(()=>{
   if(!zoomed||stage.classList.contains('completed'))return;
   caption.classList.add('visible');
   captionHideTimer=setTimeout(()=>{
    caption.classList.remove('visible');
    completeBtnTimer=setTimeout(()=>{
      if(zoomed&&!stage.classList.contains('completed')){
       btn.textContent='조사 완료'; controls.classList.remove('is-hidden');
      }
    },600);
   },5000);
  },1700);
 }else{
  clearCaption();stage.classList.add('completed');end.classList.add('open');
  controls.classList.add('is-hidden');
 }
});
document.getElementById('replay').addEventListener('click',()=>{
 clearCaption();zoomed=false;stage.classList.remove('zoomed','completed');end.classList.remove('open');
 btn.textContent='⌕ 줌 +';controls.classList.remove('is-hidden');
});
</script></body></html>

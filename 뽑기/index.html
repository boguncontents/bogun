dow:0 0 0 8px #9c3997;z-index:3}.bulbs{position:absolute;inset:-4%;width:108%;height:108%;pointer-events:none;z-index:5;animation:glow .6s steps(2) infinite}@keyframes glow{50%{filter:brightness(1.7)}}.machine{position:relative;width:min(590px,68vh,100%);height:min(650px,72vh);border:12px solid #ffce58;border-radius:44px;background:linear-gradient(140deg,#ff6ac1,#9a34d0 65%,#5532a7);box-shadow:inset 0 0 30px #fff5,0 20px 40px #0008,0 0 50px #fa61ce7a;display:flex;flex-direction:column;align-items:center;padding:24px}.machineTop{height:65%;width:100%;border:9px solid #fff8da;border-radius:32px 32px 90px 90px;background:radial-gradient(circle at 50% 100%,#302787,#161850);position:relative;overflow:hidden}.capsules{height:100%;width:100%;display:flex;align-content:end;align-items:end;justify-content:center;flex-wrap:wrap;padding:15% 4% 1%;gap:1%;transform:rotate(-8deg)}.cap{width:19%;aspect-ratio:1;border-radius:50%;border:4px solid #ffffff9c;background:linear-gradient(165deg,#ffdc4b 50%,#ff6eae 51%);box-shadow:inset 9px 7px 12px #fff8,0 7px 4px #0005}.cap:nth-child(3n){background:linear-gradient(165deg,#94ffff 50%,#5181ff 51%)}.cap:nth-child(4n){background:linear-gradient(165deg,#e7b0ff 50%,#f374ca 51%)}.machineBottom{display:flex;align-items:center;justify-content:space-around;flex:1;width:100%}.handle{font-size:90px;filter:drop-shadow(0 8px 5px #0007)}.mouth{height:90px;width:150px;border:9px solid #ffde86;background:#15143a;border-radius:15px 15px 40px 40px;box-shadow:inset 0 12px 25px #000}.machine.shake{animation:shake .12s linear 12}@keyframes shake{25%{transform:translateX(-8px) rotate(-1deg)}75%{transform:translateX(8px) rotate(1deg)}}.ticketSide{width:min(30%,405px);min-width:270px}.ticketStage{height:100%;width:100%;max-width:1000px;display:grid;place-items:center}.ticketBoard{border:10px solid #ffde42;border-radius:15px;width:min(100%,1000px);max-height:74vh;display:flex;flex-direction:column;padding:12px 15px;background:#0866b6;box-shadow:0 17px 0 #8c519b,0 0 40px #ffcf56a8}.ticketHeader{border:4px solid #fff193;background:linear-gradient(110deg,#ffec2b,#fcae36);color:#0754ae;padding:6px;font-size:clamp(22px,2.2vw,38px);font-weight:1000;text-align:center;text-shadow:2px 2px white;margin-bottom:9px}.ticketGrid{display:grid;grid-template-columns:repeat(20,minmax(0,1fr));gap:3px;min-height:0;flex:1}.ticket{font-family:inherit;min-height:0;aspect-ratio:.68;border:1px solid #fff386;background:linear-gradient(90deg,#0b4ca7,#1477da 50%,#054299);color:#ffe348;border-radius:2px;display:grid;place-items:center;padding:0;font-size:clamp(10px,1.25vw,23px);cursor:pointer;box-shadow:inset 2px 0 #fff5}.ticket:not(.taken):hover{outline:3px solid #fff;transform:scale(1.08);z-index:1}.ticket.taken{background:#073b80;border:1px dashed #6aa3d4;cursor:default;color:transparent;box-shadow:inset 0 0 7px #001b45}.bottomNote{margin:8px 0 0;color:#fff8b8;text-align:center;font-size:clamp(13px,1.15vw,18px)}.overlay{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#090520da;backdrop-filter:blur(6px);padding:20px}.overlay.show{display:flex}.resultBox{text-align:center;width:min(760px,92vw);border:7px solid #ffdf65;border-radius:40px;background:radial-gradient(circle at top,#8f50ed,#3c1b81 65%,#1b1151);box-shadow:0 0 0 10px #f35ed7,0 0 90px #eb5ec1;padding:34px 28px}.resultBox .big{font-size:clamp(66px,9vw,125px)}.resultBox h2{font-size:clamp(30px,4vw,58px);color:#ffe67b;margin:7px 0 17px}.resultBox .resultTitle{font-size:clamp(28px,3.7vw,53px);font-weight:1000}.resultBox .prize{font-size:clamp(22px,2.8vw,38px);color:#fff1a4;margin:14px 0}.resultBox .action{max-width:570px}.paper{width:230px;max-width:40vw;min-height:160px;background:repeating-linear-gradient(#fffbe9 0 28px,#e9e2cb 29px 30px);color:#30226a;box-shadow:8px 12px 15px #0005;display:grid;place-items:center;font-size:37px;font-weight:1000;animation:unfold .8s ease-out both;margin:14px auto}.paper strong{transform:rotate(-4deg)}@keyframes unfold{from{transform:scaleY(.12) rotate(-7deg);opacity:.5}to{transform:scaleY(1) rotate(0)}}.confetti{position:fixed;pointer-events:none;z-index:25;top:-15px;width:12px;height:21px;animation:fall var(--duration) linear forwards}@keyframes fall{to{transform:translate(var(--shift),110vh) rotate(820deg)}}.notice{margin:8px 0;color:#ffe7a5;font-weight:800}button:focus-visible{outline:4px solid #fff;outline-offset:4px}@media(max-width:1000px){.choices{gap:10px}.gameCard{min-height:250px}.play{gap:16px}.side{min-width:235px;padding:16px}.ticketSide{min-width:225px}.ticketGrid{gap:1px}.ticketBoard{padding:7px}.wheelFrame{width:min(62vw,70vh)}}@media(max-width:720px){.top{padding-top:46px}.choices{grid-template-columns:1fr}.home{justify-content:flex-start}.gameCard{min-height:145px;padding:9px}.gameCard .illustration{font-size:55px}.gameCard strong{font-size:23px;margin:4px}.gameCard span{font-size:14px}.play{flex-direction:column}.stage{height:auto;width:100%}.side,.ticketSide{width:100%;min-width:0}.wheelFrame{width:min(75vw,55vh)}.machine{height:420px;width:min(82vw,410px)}.ticketStage{height:auto}.ticketBoard{max-height:none;height:420px}.ticket{font-size:10px}.shell{padding:10px}.smallBtn{top:5px}.back{top:5px}}

/* 종이 뽑기: 결과를 팝업 바깥 글씨가 아닌 펼쳐진 종이 안에 직접 표시 */
.resultBox.paperMode{width:min(820px,94vw);padding:24px 28px 28px}
.resultBox.paperMode #resultEmoji,.resultBox.paperMode #resultHeading,.resultBox.paperMode #resultTitle,.resultBox.paperMode #resultPrize{display:none}
.resultBox.paperMode #paperArea{display:flex;justify-content:center;align-items:center}
.resultBox.paperMode .paper{position:relative;width:min(620px,78vw);max-width:none;min-height:min(355px,52vh);margin:8px auto 18px;padding:34px 38px 35px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;text-align:center;background:linear-gradient(90deg,#e7d8b2 0 4%,#fff7db 5% 48%,#f7edce 49% 51%,#fff9e8 52% 95%,#e9dbb7 96%);border:3px solid #e8c77c;box-shadow:inset 8px 0 14px #9a78352c,inset -8px 0 14px #9a78352c,10px 15px 25px #0007;animation:paperOpen 1s cubic-bezier(.15,.8,.24,1) both;transform-origin:center center;color:#3e2869;overflow:hidden}
.resultBox.paperMode .paper:before{content:'★ 행운의 종이 뽑기 ★';font-size:clamp(17px,2vw,26px);font-weight:1000;color:#b54c94;letter-spacing:1px;border-bottom:2px dashed #d3ae64;padding-bottom:10px;width:100%}
.paper .paperEmoji{font-size:clamp(38px,5vw,70px);line-height:1}
.paper .paperTitle{font-size:clamp(23px,3.3vw,45px);font-weight:1000;line-height:1.25;word-break:keep-all}
.paper .paperPrize{font-size:clamp(20px,2.5vw,34px);font-weight:1000;line-height:1.3;color:#b22d7a;word-break:keep-all}
@keyframes paperOpen{0%{opacity:.65;transform:perspective(900px) rotateY(82deg) scale(.72)}45%{opacity:1;transform:perspective(900px) rotateY(-16deg) scale(.92)}75%{transform:perspective(900px) rotateY(8deg) scale(1.025)}100%{transform:perspective(900px) rotateY(0) scale(1)}}
@media(max-width:720px){.resultBox.paperMode .paper{width:85vw;min-height:275px;padding:22px 18px}}

/* v3: 전자칠판 16:9 종이 뽑기판 확대 — 기존 게임 로직 유지 */
#ticketScreen{gap:clamp(10px,1.3vw,24px);padding:0 2px 8px;align-items:center}
#ticketScreen .ticketStage{width:auto;flex:1 1 auto;min-width:0;max-width:none;height:auto;max-height:none;display:flex;align-items:center;justify-content:center}
#ticketScreen .ticketBoard{width:100%;max-width:none;height:min(76dvh,760px);max-height:none;padding:clamp(8px,1vw,16px);border-width:clamp(6px,.8vw,12px);border-radius:20px}
#ticketScreen .ticketHeader{flex:0 0 auto;margin-bottom:clamp(5px,.7vh,10px);padding:clamp(3px,.5vh,10px);font-size:clamp(25px,2.7vw,48px)}
#ticketScreen .ticketGrid{grid-template-columns:repeat(20,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:clamp(2px,.23vw,5px);min-height:0;flex:1 1 auto}
#ticketScreen .ticket{width:100%;height:100%;min-width:0;min-height:0;aspect-ratio:auto;font-size:clamp(17px,1.9vw,34px);border-radius:3px}
#ticketScreen .bottomNote{flex:0 0 auto;margin-top:7px;font-size:clamp(14px,1.2vw,20px)}
#ticketScreen .ticketSide{width:clamp(190px,19vw,275px);min-width:0;flex:0 0 auto;padding:clamp(12px,1.3vw,24px)}
#ticketScreen .ticketSide h2{font-size:clamp(23px,2.25vw,36px)}
#ticketScreen .ticketSide p{font-size:clamp(15px,1.3vw,20px)}
#ticketScreen .ticketSide .action{font-size:clamp(14px,1.25vw,19px)!important;padding:13px 8px}
@media(min-width:1100px) and (max-aspect-ratio: 15/10){#ticketScreen .ticketBoard{height:min(70dvh,700px)}}
@media(max-width:720px){#ticketScreen{flex-direction:column}#ticketScreen .ticketStage{width:100%;flex:none}#ticketScreen .ticketBoard{height:min(58dvh,560px)}#ticketScreen .ticketSide{width:100%;max-width:none}#ticketScreen .ticket{font-size:12px}}

/* 꽝 전용: 화려한 축하 대신 코믹한 먹구름과 비 */
.resultBox.blankMode{background:radial-gradient(circle at 50% 0%,#62658e,#303054 62%,#17183b);border-color:#9db4dc;box-shadow:0 0 0 9px #5366a3,0 0 60px #7d92d277;animation:blankBump .55s ease-out}
.resultBox.blankMode h2{color:#dbe7ff}
.resultBox.blankMode .resultTitle{color:#fff4cb}
.resultBox.blankMode.paperMode .paper{animation:paperOpen 1s cubic-bezier(.15,.8,.24,1) both}
@keyframes blankBump{0%,100%{translate:0 0}20%{translate:-10px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:3px 0}}
.sadCloud{position:fixed;top:2%;left:50%;transform:translateX(-50%);font-size:clamp(60px,9vw,120px);z-index:26;pointer-events:none;animation:cloudPop 2.4s ease-out forwards;filter:drop-shadow(0 8px 9px #080b3488)}
@keyframes cloudPop{0%{opacity:0;transform:translate(-50%,-45px) scale(.5)}18%,75%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-15px) scale(1.05)}}
.sadDrop{position:fixed;z-index:25;top:-30px;width:10px;height:27px;border-radius:60% 60% 60% 60%;background:linear-gradient(160deg,#d6f6ff,#45a9f4);pointer-events:none;transform:rotate(13deg);animation:sadRain var(--duration) linear forwards;opacity:.85}
@keyframes sadRain{to{transform:translateY(108vh) rotate(13deg);opacity:.3}}

/* v6: 룰렛 시작 버튼 — 화면 너비와 무관하게 정확히 두 줄 고정 */
#spinBtn.spinAction{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;white-space:nowrap;word-break:keep-all;line-height:1.18;min-width:0;padding:clamp(12px,1.5vw,20px) clamp(6px,1vw,16px);font-size:clamp(17px,2vw,29px)}
#spinBtn.spinAction .spinLine1,#spinBtn.spinAction .spinLine2{display:block;width:100%;text-align:center;white-space:nowrap}
@media(max-width:1000px){#spinBtn.spinAction{font-size:clamp(17px,2.4vw,25px)}}
@media(max-width:720px){#spinBtn.spinAction{font-size:clamp(20px,4vw,28px)}}
</style></head><body><main class="shell"><header class="top"><button class="back" id="homeBtn" hidden>◀ 게임 선택</button><h1 class="title">🎉 상품 뽑기!! 보너스 게임 🎉</h1><button class="smallBtn" id="soundBtn">🔊 효과음 켜짐</button></header>
<section class="screen home active" id="home"><h2>✨ 어떤 행운에 도전할까요? ✨</h2><div class="choices"><button class="gameCard" data-game="wheel"><div class="illustration">🎡</div><strong>행운의 룰렛</strong><span>20칸 빙글빙글!</span></button><button class="gameCard" data-game="ticket"><div class="illustration">⭐</div><strong>추억의 종이 뽑기</strong><span>직접 한 장을 뜯어보세요!</span></button></div></section>
<section class="screen play" id="wheelScreen"><div class="stage"><div class="wheelFrame"><canvas id="wheelCanvas"></canvas><svg id="bulbs" class="bulbs" viewBox="0 0 500 500"></svg><div class="wheelPointer"></div><div class="wheelHub">🎁</div></div></div><aside class="side"><h2>🎡 행운의 룰렛</h2><p id="wheelMsg">두근두근!<br>오늘의 행운은 누구에게?</p><button id="spinBtn" class="action spinAction"><span class="spinLine1">✨ START!</span><span class="spinLine2">룰렛 돌리기</span></button></aside></section>

<section class="screen play" id="ticketScreen"><div class="stage ticketStage"><div class="ticketBoard"><div class="ticketHeader">⭐ 추억의 종이 뽑기 ⭐</div><div class="ticketGrid" id="ticketGrid"></div><p class="bottomNote">마음에 드는 별 종이를 한 장 선택하세요!</p></div></div><aside class="side ticketSide"><h2>⭐ 종이 뽑기</h2><p>접힌 종이를 한 장 골라<br>뜯고 펼쳐보세요!</p><p class="notice" id="ticketCount"></p><button class="action secondary" id="resetTickets" style="font-size:clamp(17px,1.6vw,23px)">🔒 교사용 뽑기판 초기화</button></aside></section>
</main><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="resultTitle"><div class="resultBox"><div class="big" id="resultEmoji">🎁</div><h2 id="resultHeading">🎉 결과 발표 🎉</h2><div id="paperArea"></div><div class="resultTitle" id="resultTitle"></div><div class="prize" id="resultPrize"></div><button class="action secondary" id="nextBtn">✨ 다음 학생 뽑기</button></div></div>
<script>
const outcomes={v1:{short:'비타민1',title:'나는 힘이 솟는다!!',prize:'비타민 1개',emoji:'💪',color:'#fb58ae'},v2:{short:'비타민2',title:'힘이 더블로 솟는다!!!',prize:'비타민 2개',emoji:'⚡',color:'#ffcf4b'},blank:{short:'꽝',title:'아쉽지만 눈물의 꽝',prize:'아쉽지만 이번엔 꽝!',emoji:'😭',color:'#8978ee'},gift:{short:'친구선물',title:'너를 응원한다!!',prize:'친구에게 비타민 1개 선물하기',emoji:'💝',color:'#ff9e62'},xyl:{short:'자일리톨',title:'치아엔 역시 자일리톨',prize:'자일리톨 캔디 1개',emoji:'🦷',color:'#41dbdc'}};
const slotIds=['v1','xyl','blank','gift','v1','blank','xyl','v2','gift','v1','xyl','blank','gift','v1','xyl','blank','gift','v2','v1','xyl'];
const ticketStorage='bonus_three_games_ticket_board_v1';let tickets=[],game='home',busy=false,sound=true,audio=null,rotation=0;const $=id=>document.getElementById(id);const TAU=Math.PI*2,STEP=TAU/20;
function beep(f=500,d=.08){if(!sound)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();let o=audio.createOscillator(),v=audio.createGain();o.type='triangle';o.frequency.value=f;v.gain.setValueAtTime(.04,audio.currentTime);v.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}
function confetti(){const colors=['#f7e65b','#ff65c7','#6ceafa','#fffcfc','#a49bff'];for(let i=0;i<90;i++){let d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=colors[i%5];d.style.setProperty('--duration',(2+Math.random()*2)+'s');d.style.setProperty('--shift',(Math.random()*240-120)+'px');document.body.append(d);setTimeout(()=>d.remove(),4200)}}
function sadEffect(){
 const cloud=document.createElement('div');cloud.className='sadCloud';cloud.textContent='🌧️';document.body.append(cloud);setTimeout(()=>cloud.remove(),2500);
 for(let i=0;i<58;i++){const d=document.createElement('div');d.className='sadDrop';d.style.left=(Math.random()*100)+'vw';d.style.top=(-20-Math.random()*90)+'px';d.style.animationDelay=(Math.random()*0.7)+'s';d.style.setProperty('--duration',(1.35+Math.random()*1.15)+'s');document.body.append(d);setTimeout(()=>d.remove(),3400)}
 [420,340,270,190].forEach((n,i)=>setTimeout(()=>beep(n,.19),i*165));
}
function newTickets(){let arr=[];for(const [id,n] of [['v1',25],['v2',10],['blank',20],['gift',20],['xyl',25]])for(let i=0;i<n;i++)arr.push({id,taken:false});for(let i=arr.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr}
function loadTickets(){try{const a=JSON.parse(localStorage.getItem(ticketStorage));tickets=Array.isArray(a)&&a.length===100&&a.every(x=>outcomes[x.id]&&typeof x.taken==='boolean')?a:newTickets()}catch(e){tickets=newTickets()}saveTickets()}
function saveTickets(){try{localStorage.setItem(ticketStorage,JSON.stringify(tickets))}catch(e){}}
function renderTickets(){let grid=$('ticketGrid');grid.replaceChildren();tickets.forEach((t,i)=>{let b=document.createElement('button');b.type='button';b.className='ticket'+(t.taken?' taken':'');b.textContent=t.taken?'':'★';b.disabled=t.taken||busy;b.setAttribute('aria-label',t.taken?`${i+1}번 뽑은 자리`:`${i+1}번 종이 뽑기`);b.onclick=()=>pickTicket(i);grid.append(b)});$('ticketCount').textContent=`남은 종이 ${tickets.filter(t=>!t.taken).length} / 100장`}
function showGame(g){if(busy)return;game=g;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(g==='home'?'home':g+'Screen').classList.add('active');$('homeBtn').hidden=g==='home';if(g==='wheel')resizeWheel();if(g==='ticket')renderTickets()}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>showGame(b.dataset.game));$('homeBtn').onclick=()=>showGame('home');$('soundBtn').onclick=()=>{sound=!sound;$('soundBtn').textContent=sound?'🔊 효과음 켜짐':'🔇 효과음 꺼짐'};
function resizeWheel(){const canvas=$('wheelCanvas'),size=Math.max(1,canvas.clientWidth);if(!size)return;let dpr=Math.min(devicePixelRatio||1,2);canvas.width=size*dpr;canvas.height=size*dpr;canvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);drawWheel()}
function drawWheel(){let c=$('wheelCanvas'),ctx=c.getContext('2d'),s=c.clientWidth;if(!s)return;let r=s/2;ctx.clearRect(0,0,s,s);ctx.save();ctx.translate(r,r);ctx.rotate(rotation);for(let i=0;i<20;i++){let it=outcomes[slotIds[i]],a=-Math.PI/2+i*STEP,b=a+STEP;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r-3,a,b);ctx.closePath();ctx.fillStyle=it.color;ctx.fill();ctx.strokeStyle='#fff6dc';ctx.lineWidth=Math.max(1.3,s*.003);ctx.stroke();ctx.save();ctx.rotate(a+STEP/2);ctx.translate(r*.67,0);ctx.rotate(Math.PI/2);ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#23204b';ctx.font=`${Math.round(s*.036)}px sans-serif`;ctx.fillText(it.emoji,0,-s*.027);ctx.font=`bold ${Math.round(s*.025)}px sans-serif`;ctx.fillText(it.short,0,s*.016);ctx.restore()}ctx.restore()}
function lights(){for(let i=0;i<48;i++){let a=i*TAU/48,el=document.createElementNS('http://www.w3.org/2000/svg','circle');el.setAttribute('cx',250+241*Math.cos(a));el.setAttribute('cy',250+241*Math.sin(a));el.setAttribute('r','6');el.setAttribute('fill',i%2?'#fff':'#ffec59');$('bulbs').append(el)}}lights();
function reveal(id,paper=false){let x=outcomes[id];$('resultEmoji').textContent=x.emoji;$('resultHeading').textContent=id==='blank'?'🥲 아쉬워요!':'🎊 당첨을 축하합니다! 🎊';$('resultTitle').textContent=x.title;$('resultPrize').textContent=x.prize;$('overlay').querySelector('.resultBox').classList.toggle('paperMode',paper);$('overlay').querySelector('.resultBox').classList.toggle('blankMode',id==='blank');$('paperArea').replaceChildren();if(paper){const sheet=document.createElement('div');sheet.className='paper';const emoji=document.createElement('div');emoji.className='paperEmoji';emoji.textContent=x.emoji;const title=document.createElement('div');title.className='paperTitle';title.textContent=x.title;const prize=document.createElement('div');prize.className='paperPrize';prize.textContent=x.prize;sheet.append(emoji,title,prize);$('paperArea').append(sheet)}$('overlay').classList.add('show');if(id==='blank'){sadEffect()}else{confetti();[523,659,784,1046].forEach((n,i)=>setTimeout(()=>beep(n,.2),i*140))}$('nextBtn').focus()}
function smooth(t){return 1-(1-t)**5}
$('spinBtn').onclick=()=>{if(busy)return;busy=true;$('spinBtn').disabled=true;$('wheelMsg').innerHTML='🎡 빙글빙글!<br>어디에서 멈출까요?';let idx=Math.floor(Math.random()*20),begin=rotation,wanted=-(idx+.5)*STEP,offset=((wanted-begin)%TAU+TAU)%TAU,end=begin+(7+Math.floor(Math.random()*3))*TAU+offset,t0=performance.now(),prev=-1;function tick(t){let p=Math.min((t-t0)/5600,1);rotation=begin+(end-begin)*smooth(p);drawWheel();let sector=Math.floor(rotation/STEP);if(sector!==prev&&p<.94){beep(460,.025);prev=sector}if(p<1)requestAnimationFrame(tick);else{rotation=end%TAU;drawWheel();busy=false;$('spinBtn').disabled=false;$('wheelMsg').innerHTML='두근두근!<br>오늘의 행운은 누구에게?';setTimeout(()=>reveal(slotIds[idx]),350)}}requestAnimationFrame(tick)};
function pickTicket(i){if(busy||tickets[i].taken)return;busy=true;tickets[i].taken=true;saveTickets();renderTickets();beep(650,.13);setTimeout(()=>{busy=false;reveal(tickets[i].id,true)},650)}
$('nextBtn').onclick=()=>{$('overlay').classList.remove('show');$('paperArea').replaceChildren();if(game==='ticket')renderTickets()};$('resetTickets').onclick=()=>{if(!confirm('종이 뽑기판의 빈자리를 모두 복구하고 상품 배치를 새로 섞을까요? 이 작업은 되돌릴 수 없습니다.'))return;let pass=prompt('교사용 초기화 확인: 화면에 초기화라고 입력해 주세요.');if(pass!=='초기화')return;tickets=newTickets();saveTickets();renderTickets();alert('뽑기판 100장을 새로 채웠습니다.')};
window.addEventListener('resize',resizeWheel);document.fonts?.ready?.then(resizeWheel);loadTickets();resizeWheel();
</script></body></html>

<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>QR 구역 1 · 선생님 증언 · A안 · 디지털 벽시계</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101318;color:white;font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-tap-highlight-color:transparent}body{display:grid;place-items:center;height:100dvh}.stage{position:relative;width:min(100vw,177.7778dvh);height:min(56.25vw,100dvh);overflow:hidden;background:#151d22;isolation:isolate}.background{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(9,17,26,.12) 0%,transparent 50%,rgba(12,18,27,.18) 77%,rgba(9,14,22,.45) 100%);pointer-events:none}.person{position:absolute;bottom:-19%;left:51.5%;height:106.2%;width:auto;max-width:62%;object-fit:contain;transform:translateX(-50%);filter:drop-shadow(0 9px 10px #17202d55);transition:opacity .48s ease;pointer-events:none}.masked{opacity:0}.hand{position:absolute;width:57%;left:10%;bottom:-18%;object-fit:contain;opacity:0;transform:translate(-10%,20%) rotate(-8deg);transform-origin:20% 85%;transition:opacity .55s ease,transform .9s ease;filter:drop-shadow(0 4px 10px #18252b35);pointer-events:none}.stage.offer .hand{opacity:1;transform:translate(0,0) rotate(-8deg)}.stage.mask-on .original{opacity:0}.stage.mask-on .masked{opacity:1}.kicker{position:absolute;top:4%;left:3%;color:white;background:#17202b94;backdrop-filter:blur(6px);border-radius:50px;font-size:clamp(11px,1.4vw,17px);padding:.5em .9em;letter-spacing:.02em}.subtitles{position:absolute;bottom:2.3%;left:50%;transform:translateX(-50%);width:83%;max-width:1040px;border-radius:12px;background:rgba(9,13,19,.76);backdrop-filter:blur(7px);padding:1.4% 2.8% 1.6%;box-shadow:0 12px 30px #0003;cursor:pointer;user-select:none;touch-action:manipulation}.speaker{display:block;color:#eed6ab;font-weight:750;letter-spacing:.015em;font-size:clamp(12px,1.58vw,21px);margin-bottom:.24em}.subline{font-size:clamp(15px,2.18vw,29px);font-weight:620;line-height:1.43;word-break:keep-all;text-wrap:pretty;text-shadow:0 1px 2px #0008}.next{position:absolute;right:1.9%;bottom:12%;color:#ffffffbf;font-size:clamp(10px,1.05vw,14px);opacity:.9}.action{position:absolute;right:2.5%;top:4%;font-size:clamp(11px,1.35vw,16px);padding:.65em 1em;background:#1d2934b5;color:#fff;border:1px solid #ffffff52;border-radius:8px;cursor:pointer}.end{display:none;position:absolute;inset:0;background:#0e151bc9;backdrop-filter:blur(8px);place-items:center;text-align:center;padding:30px}.end.open{display:grid}.end h2{font-size:clamp(22px,3vw,42px);margin:0 0 12px}.end p{font-size:clamp(14px,1.6vw,22px);color:#e8edf3;line-height:1.6}.end button{font:inherit;font-size:clamp(14px,1.6vw,20px);background:#f7e3b9;color:#25231f;border:0;border-radius:12px;padding:.7em 2em;cursor:pointer}@media (max-aspect-ratio: 9/8){.stage{width:100vw;height:100dvh}.background{object-position:center top;object-fit:cover}.person{height:84.6%;bottom:8%;left:51%;max-width:96%}.hand{width:105%;left:-12%;bottom:7%}.subtitles{bottom:5%;width:94%;padding:15px 17px;border-radius:10px}.subline{font-size:clamp(17px,3.7vw,25px)}.speaker{font-size:clamp(14px,3vw,20px)}.next{bottom:19%}.kicker{top:2%}}
@media(prefers-reduced-motion:reduce){.person,.hand{transition:none}}

/* 승인된 배경과 독립된 반실사 디지털 벽시계 이미지. 조사 완료 때 숨김 */
.wallclock{position:absolute;left:72%;top:10%;width:11%;min-width:80px;height:auto;transform:translateX(-50%);pointer-events:none;z-index:2;filter:drop-shadow(0 2px 3px #0005)}
.stage.completed .wallclock{display:none}
@media(max-aspect-ratio:9/8){.wallclock{left:73%;top:12%;width:18%;min-width:70px}}
</style></head><body><main class="stage" id="stage" aria-label="선생님 증언 장면"><img class="background" src="assets/classroom.webp" alt="교실 뒤쪽 전경"><div class="shade"></div><img class="wallclock" src="assets/digital_clock_0840.webp" alt="오전 8시 40분을 가리키는 교실 디지털 벽시계"><span class="kicker">사건 현장 · 선생님의 증언</span><img class="person original" src="assets/seoyeon.webp" alt="마스크를 쓰지 않은 서연"><img class="person masked" src="assets/seoyeon_mask.webp" alt="마스크를 쓴 서연"><img class="hand" src="assets/teacher_hand.webp" alt="선생님이 건네는 마스크"><button type="button" class="action" id="restart">처음부터</button><section class="subtitles" id="subtitle" role="button" tabindex="0" aria-label="대사를 눌러 다음으로"><span class="speaker" id="speaker"></span><div class="subline" id="line"></div></section><div class="next" id="next">화면을 눌러 계속 ›</div><section class="end" id="end"><div><h2>조사 완료</h2><p>관찰한 사실과 시각을 수사수첩에 기록해 주세요.<br>이 장면에서는 정답을 알려주지 않습니다.</p><button type="button" id="replay">다시 보기</button></div></section></main><script>
'use strict';
// 사용자 확정 대사 적용. 마지막 하린 관련 문장은 이전 임시 문구 유지.
const scenes=[
 {who:'선생님',text:'서연아, 마스크 필요하다고 했지? 여기 있어!',offer:true},
 {who:'서연',text:'마스크 감사합니다. 애들이 기침을 많이 해서 옮을 거 같아서요...',masked:true},
 {who:'선생님',text:'그래, 걱정되면 일단 쓰고 있다가 졸업사진 찍을 때는 벗으렴.',masked:true},
 {who:'선생님',text:'요즘 감기가 유행인가? 하린이도 어제 감기 때문에 병원 진료를 받았다고 했는데…',masked:true}
];
let index=0;
const stage=document.getElementById('stage'),end=document.getElementById('end');
const speaker=document.getElementById('speaker'),line=document.getElementById('line');
function draw(){let s=scenes[index];stage.classList.remove('completed');end.classList.remove('open');stage.classList.toggle('offer',!!s.offer);stage.classList.toggle('mask-on',!!s.masked);speaker.textContent=s.who;line.textContent=s.text;document.getElementById('next').textContent=index===scenes.length-1?'마지막 대사 · 계속 ›':'화면을 눌러 계속 ›';}
function advance(){if(end.classList.contains('open'))return;if(index>=scenes.length-1){stage.classList.add('completed');end.classList.add('open');return;}index++;draw();}
function reset(){index=0;draw();}
document.getElementById('subtitle').addEventListener('click',advance);
document.getElementById('subtitle').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance();}});
document.getElementById('next').addEventListener('click',advance);
document.getElementById('restart').addEventListener('click',reset);
document.getElementById('replay').addEventListener('click',reset);
draw();
</script></body></html>

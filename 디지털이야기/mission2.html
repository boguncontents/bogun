<script src="progress.js?v=16"></script><script>

/* Expression images must never block dialogue progression. */
function setGameExpression(element, character, mood='base') {
  if (!element) return;
  const fallback = `assets/${character}.png`;
  const available = { harin:['smile','worry','surprise'], mom:['worry','smile'], teacher:['listening','smile'], yuna:['worry','sad','relief'], doyun:['worry','surprise','sad','relief'] };
  let target = mood !== 'base' && (available[character] || []).includes(mood)
    ? `assets/expressions/${character}_${mood}.png` : fallback;
  try {
    // Use the existing expression helper when it has loaded correctly.
    if (window.DSExpressions && typeof window.DSExpressions.set === 'function') {
      window.DSExpressions.set(element, character, mood);
      target = element.getAttribute('src') || target;
    } else if (element.getAttribute('src') !== target) {
      element.setAttribute('src', target);
    }
  } catch (_error) {
    target = fallback;
    if (element.getAttribute('src') !== fallback) element.setAttribute('src', fallback);
  }
  element.onerror = () => {
    element.onerror = null;
    if (element.getAttribute('src') !== fallback) element.setAttribute('src', fallback);
  };
}
const ROAD=[
 {scene:'road',speaker:'장면 전환',text:'하교길 · 방과 후'},
 {scene:'road',speaker:'효과음',text:'띠링!'},
 {scene:'road',speaker:'주인공',text:'어? 우리 반 단톡방 알림이 왔네.'}
];
const AFTER_CHAT=[
 {scene:'home',speaker:'주인공 속마음',text:'이제 방과 후니까 엄마한테 말씀드려야겠다. 엄마와 함께 선생님께도 알려 드리면 좋겠어.',character:null},
 {scene:'home',speaker:'주인공',text:'엄마, 오늘 단톡방에서 친구가 다른 친구의 사진을 몰래 올렸어. 선생님께 말하지 말라고 화내서 무서웠어.',character:'mom'},
 {scene:'home',speaker:'엄마',text:'그랬구나. 잘못된 행동에 동조하지 않은 건 잘했어. 엄마가 학교에 이야기해 줄게.',character:'mom'},
 {scene:'home',speaker:'주인공',text:'응, 엄마! 고마워.',character:'mom'},
 {scene:'night',speaker:'주인공 속마음',text:'혼자 고민하지 않고 엄마에게 이야기하길 잘했어.',character:null},
 {scene:'night',speaker:'주인공 속마음',text:'친구들이 다 같이 웃어도 잘못된 행동은 잘못된 거야. 필요한 대화도 남겼고, 이제 엄마와 함께 도움을 요청할 거야.',character:null}
];
const stage=document.getElementById('sceneStage'),speaker=document.getElementById('speaker'),line=document.getElementById('line'),next=document.getElementById('next');
const dialog=document.querySelector('.dialog'),sprite=document.getElementById('character');
const overlay=document.getElementById('phoneOverlay'),frame=document.getElementById('phoneFrame');
let part='road',idx=0,ready=false,pending=false,clipFrame=0,phoneStep=0;
let cinematicLocked=false,lastCinematicKey=null,eyesFullyClosed=false,eyesCloseToken=0;
function lockCinematic(active){cinematicLocked=active;}

const storedM2=DSProgress.get();
if(storedM2?.page==='mission2.html'){
 const d=storedM2.data||{};
 if(['road','chat','after'].includes(d.part))part=d.part;
 idx=Number.isInteger(d.idx)?Math.max(0,d.idx):0;
 phoneStep=Number.isInteger(d.phoneStep)?Math.max(0,d.phoneStep):0;
 idx=Math.min(idx,(part==='road'?ROAD:AFTER_CHAT).length-1);
}
function saveM2(){DSProgress.save('mission2.html',{part,idx,phoneStep})}

function scheduleClip(){
 cancelAnimationFrame(clipFrame);
 clipFrame=requestAnimationFrame(()=>{
   sprite.style.setProperty('--sprite-hide-bottom','0px');
   if(sprite.classList.contains('is-hidden')) return;
   const r=sprite.getBoundingClientRect(), d=dialog.getBoundingClientRect();
   sprite.style.setProperty('--sprite-hide-bottom',Math.max(0,Math.min(sprite.offsetHeight,(r.bottom-(d.top+8))*(sprite.offsetHeight/Math.max(1,r.height)))).toFixed(1)+'px');
 })
}
function applyVisual(item){
 stage.dataset.scene=item.scene;
 if(item.character==='mom'){
   setGameExpression(sprite,'mom',idx===3?'smile':'worry');
   sprite.dataset.character='mom';
   sprite.alt='엄마 캐릭터';
   sprite.classList.remove('is-hidden');
 } else {
   sprite.classList.add('is-hidden');
 }
}
function applyCinematics(){
 const key=part+':'+idx;
 if(lastCinematicKey===key)return;
 lastCinematicKey=key;
 dialog.classList.remove('ds-notification-shake');
 sprite.classList.remove('ds-mom-entrance');
 if(part==='road' && idx===1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
   void dialog.offsetWidth;
   dialog.classList.add('ds-notification-shake');
 }
 if(part==='after' && idx===1 && !window.matchMedia('(prefers-reduced-motion: reduce)').matches){
   lockCinematic(true);
   void sprite.offsetWidth;
   sprite.classList.add('ds-mom-entrance');
 }
 if(part==='after' && idx===AFTER_CHAT.length-1){
   eyesFullyClosed=false;
   finishedLids.clear();
   lockCinematic(true);
   if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
     stage.classList.add('ds-eyes-closed');eyesFullyClosed=true;lockCinematic(false);
   }else{
     const token=++eyesCloseToken;
     stage.classList.remove('ds-eyes-closed','ds-eyes-closing');
     requestAnimationFrame(()=>requestAnimationFrame(()=>{
       if(token===eyesCloseToken)stage.classList.add('ds-eyes-closing');
     }));
   }
 }
}
const eyeLids=[...stage.querySelectorAll('.ds-eye-lid')];
const finishedLids=new Set();
for(const lid of eyeLids){
 lid.addEventListener('transitionend', e=>{
  if(e.target!==lid || e.propertyName!=='transform' || !stage.classList.contains('ds-eyes-closing'))return;
  finishedLids.add(lid);
  if(finishedLids.size!==eyeLids.length)return;
  finishedLids.clear();
  stage.classList.add('ds-eyes-closed');
  stage.classList.remove('ds-eyes-closing');
  // Confirm both eyelids are settled before making Next interactive.
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    eyesFullyClosed=true;
    lockCinematic(false);
  }));
 });
}
sprite.addEventListener('animationend', e=>{if(e.animationName==='dsMomEnter'){sprite.classList.remove('ds-mom-entrance');lockCinematic(false);}});
dialog.addEventListener('animationend', e=>{if(e.animationName==='dsM2Shake')dialog.classList.remove('ds-notification-shake');});
function render(){
 dialog.classList.remove('is-choice');
 const list = part==='road' ? ROAD : AFTER_CHAT;
 const item = list[idx];
 applyVisual(item);
 speaker.textContent=item.speaker;
 line.textContent=item.text;
 if(part==='road'){
   next.textContent = idx===ROAD.length-1 ? '단톡방 열기 ▾' : '다음 ▾';
 } else {
   next.textContent = idx===AFTER_CHAT.length-1 ? '다음 ▾' : '다음 ▾';
 }
 applyCinematics();
 scheduleClip();saveM2();
}
function startChat(){
 part='chat';saveM2();
 overlay.classList.add('active');
 pending=true;
 if(ready){
   frame.contentWindow.postMessage({type:'DS_AI_START',mission:2,resumeStep:phoneStep},'*');
   pending=false;
 } else {
   frame.src='offline_chat.html?mission=2&v=08&ui=05';
 }
}
function resumeAfterChat(){
 overlay.classList.remove('active');
 part='after';
 idx=0;
 render();
}
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||!event.data) return;
 if(event.data.type==='DS_CHAT_PROGRESS'&&event.data.mission===2){phoneStep=event.data.step;saveM2();}
 if(event.data.type==='DS_CHAT_READY'){
   ready=true;
   if(pending){
     frame.contentWindow.postMessage({type:'DS_AI_START',mission:2,resumeStep:phoneStep},'*');
     pending=false;
   }
 }
 if(event.data.type==='DS_AI_FINISH'&&event.data.mission===2&&part==='chat') resumeAfterChat();
});
next.addEventListener('click',()=>{
 if(cinematicLocked || (part==='after' && idx===AFTER_CHAT.length-1 && !eyesFullyClosed))return;
 if(part==='road'){
   if(idx<ROAD.length-1){ idx++; render(); }
   else startChat();
 } else if(part==='after'){
   if(idx<AFTER_CHAT.length-1){ idx++; render(); }
   else { part='done'; location.href='mission3.html'; }
 }
});
sprite.addEventListener('load',scheduleClip);
window.addEventListener('resize',scheduleClip);
window.visualViewport?.addEventListener('resize',scheduleClip);
if(part==='chat')startChat();else render();
</script><script src="scene-responsive.js?v=6"></script></body></html>

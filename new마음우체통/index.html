;padding:14px;margin:0 0 9px}.comment p{line-height:1.6;white-space:pre-wrap;margin:8px 0}.comment-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.comment-controls{display:flex;gap:6px}.board-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.board-replies{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;max-height:73vh;overflow:auto;align-content:start}.board-replies .comment{margin:0;padding:20px}.board-replies .comment p{font-size:clamp(16px,1.35vw,21px)}.board .story-body{max-height:74vh}.notice{border-radius:14px;padding:13px;background:#f7f1fb;color:#654fa3}.lock{min-height:75vh;display:grid;place-content:center;text-align:center;gap:12px}.lock h1{font-size:clamp(32px,5vw,56px)}.dialog{position:fixed;inset:0;background:#16182977;display:grid;place-items:center;z-index:100}.dialog .panel{max-width:410px;width:calc(100% - 24px)}.dialog input{margin:12px 0}.right{text-align:right}.bar-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}.stack{display:grid;gap:12px}.loading{padding:10vh;text-align:center}@media(max-width:850px){.page{padding:13px}.panel{padding:16px}.landing{grid-template-columns:1fr;min-height:auto}.landing .hero{min-height:230px}.mailbox{font-size:90px}.grid-two,.admin-grid{grid-template-columns:1fr}.five{grid-template-columns:repeat(2,minmax(0,1fr))}.board-replies{grid-template-columns:1fr;max-height:none}.story-body{max-height:none}}@media(min-width:851px) and (max-height:720px){.page{padding:10px 20px}.panel{padding:15px}.story-body{max-height:50vh}.board .story-body{max-height:60vh}}

/* --------------------------------------------------------------
   마음우체통 · 교사용 화면 전용 디자인 정돈 v1
   Firebase / 입력 / 관리 이벤트 코드는 변경하지 않습니다.
   -------------------------------------------------------------- */
.page.admin {
  --admin-violet:#6755c4;
  --admin-deep:#28324c;
  --admin-text:#414b68;
  --admin-border:#e3e4f0;
  color:var(--admin-deep);
  max-width:1580px;
  padding:clamp(12px,1.5vw,24px);
  font-family:'Pretendard Variable','Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
}
.page.admin .top {
  min-height:76px;
  padding:12px 22px;
  background:linear-gradient(110deg,rgba(255,255,255,.96),rgba(246,244,255,.96));
  border:1px solid #e5e1f1;
  border-radius:19px;
  box-shadow:0 4px 20px rgba(73,52,123,.055);
  margin-bottom:14px;
}
.page.admin .brand {
  font-size:clamp(23px,2.15vw,31px);
  letter-spacing:-.7px;
  line-height:1.25;
}
.page.admin .brand small {
  margin-top:5px;
  font-size:12px;
  font-weight:500;
  letter-spacing:0;
}
.page.admin .actions {gap:10px;}
.page.admin #admin-class {
  min-height:44px;
  border:1px solid #dfddf0;
  background:#fff;
  border-radius:12px;
  font-size:14px;
  font-weight:700;
  box-shadow:0 2px 6px rgba(54,47,99,.025);
}
.page.admin .btn {
  transition:background-color .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.page.admin .btn:focus-visible,.page.admin .input:focus-visible {
  outline:3px solid #b9a5fa;outline-offset:2px;
}
.page.admin [data-action="publish"] {
  min-height:44px;
  background:linear-gradient(108deg,#8071df,#6450d6);
  padding:10px 21px;
  border-radius:12px;
  font-size:15px;
  box-shadow:0 5px 14px rgba(99,76,205,.20);
}
.page.admin [data-action="publish"]:hover {box-shadow:0 7px 20px rgba(99,76,205,.29);}
.page.admin .panel {
  background:rgba(255,255,255,.96);
  border:1px solid #e5e4ee;
  border-radius:19px;
  box-shadow:0 5px 22px rgba(65,52,107,.055);
}
.page.admin > .panel {
  padding:19px 20px 16px;
  margin-bottom:14px !important;
}
.page.admin > .panel > .bar-title {margin-bottom:12px;}
.page.admin .bar-title h3 {
  font-size:17px;
  margin:0;
  letter-spacing:-.45px;
}
.page.admin .bar-title h2 {
  font-size:clamp(18px,1.65vw,23px);
  margin:0 0 5px;
  line-height:1.4;
  letter-spacing:-.45px;
}
.page.admin .bar-title .muted {font-size:13px;margin:0;line-height:1.6;}
.page.admin .pill {
  font-weight:700;
  font-size:12px;
  background:#f0edff;
  color:#725cc2;
  border:1px solid #e8e1ff;
}
.page.admin > .panel > .bar-title .pill {
  color:#188563;
  background:#e6faf1;
  border-color:#cff0de;
}
.page.admin .stats {
  display:grid;
  grid-template-columns:minmax(280px,360px) minmax(240px,300px);
  gap:12px;
  margin-bottom:14px;
}
.page.admin .stat {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:9px;
  min-height:75px;
  padding:13px 14px;
  font-size:14px;
  font-weight:700;
  background:linear-gradient(115deg,#f9f6ff,#fcfaff);
  border:1px solid #ece6f7;
  border-radius:14px;
  white-space:nowrap;
}
.page.admin .stat:nth-child(2) {
  background:linear-gradient(115deg,#f4fcf7,#fcfffd);
  border-color:#dcefe4;
}
.page.admin .stat strong {
  display:inline;
  font-size:clamp(24px,2.5vw,32px);
  line-height:1;
  font-weight:850;
  color:#5a48c4;
  font-variant-numeric:tabular-nums;
}
.page.admin .stat:nth-child(2) strong {color:#139368;}
.page.admin #target {font-weight:800;text-align:center;border-radius:10px;padding:8px 6px;color:#45368c;}
.page.admin [data-action="target"] {background:#fff;color:#5543af;border-color:#ded9f5;}
.page.admin > .panel > h3 {
  font-size:15px;
  margin:9px 0 10px;
  letter-spacing:-.25px;
}
.page.admin .five {gap:10px;}
.page.admin .five button {
  min-width:0;
  min-height:107px;
  background:#fff;
  border:1px solid #e4e4ed;
  border-radius:14px;
  padding:11px 12px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  text-align:left;
  box-shadow:0 1px 4px rgba(41,38,81,.025);
}
.page.admin .five button:hover,.page.admin .admin-list button:hover {
  border-color:#b9a9ef;
  background:#fcfaff;
}
.page.admin .five button strong {
  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;
  overflow:hidden;
  font-size:12px;
  line-height:1.45;
  font-weight:760;
  letter-spacing:-.1px;
}
.page.admin .five .count {
  text-align:right;
  width:100%;
  font-size:16px;
  line-height:1.2;
  margin-top:5px;
  font-variant-numeric:tabular-nums;
  color:#6153b9;
}
.page.admin .five button:nth-child(2) .count{color:#d56991;}
.page.admin .five button:nth-child(3) .count{color:#bc852b;}
.page.admin .five button:nth-child(4) .count{color:#249b78;}
.page.admin .five button:nth-child(5) .count{color:#398bd4;}
.page.admin .five .progress {width:100%;height:8px;background:#e9eaf1;}
.page.admin .five button:nth-child(1) .progress > div {background:#9481df;}
.page.admin .five button:nth-child(2) .progress > div {background:#f08faf;}
.page.admin .five button:nth-child(3) .progress > div {background:#ecc56d;}
.page.admin .five button:nth-child(4) .progress > div {background:#73cda8;}
.page.admin .five button:nth-child(5) .progress > div {background:#88baf0;}
.page.admin .admin-grid {
  grid-template-columns:minmax(242px,27%) minmax(0,1fr);
  gap:13px;
}
.page.admin .admin-grid > .panel {padding:18px;}
.page.admin .admin-list {gap:7px;}
.page.admin .admin-list h3 {
  margin:0 0 6px;
  color:#4f40a1;
  font-size:18px;
  letter-spacing:-.3px;
}
.page.admin .admin-list button {
  padding:12px 13px;
  min-height:57px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  line-height:1.45;
  font-size:13px;
  font-weight:650;
  white-space:normal;
  color:#414662;
  border-radius:12px;
  border:1px solid #e5e4ee;
}
.page.admin .admin-list button.selected {
  background:#f4eeff;
  color:#5842b7;
  border-color:#b5a2ef;
  box-shadow:inset 3px 0 0 #866ad9;
}
.page.admin .admin-list button .pill {white-space:nowrap;flex-shrink:0;}
.page.admin .admin-grid > section.panel > .bar-title {
  padding-bottom:14px;
  margin-bottom:13px;
  border-bottom:1px solid #eeedf4;
}
.page.admin .comment {
  padding:14px 15px;
  background:#fff;
  border:1px solid #e6e6ef;
  border-radius:13px;
  margin-bottom:9px;
  box-shadow:0 1px 4px rgba(43,41,87,.025);
}
.page.admin .comment:has([data-hide].selected) {
  background:#fbfafc;
  border-color:#e8e6eb;
}
.page.admin .comment .reply-head {margin-bottom:0;gap:10px;}
.page.admin .comment .reply-head strong {font-size:14px;}
.page.admin .comment .avatar {width:38px;height:38px;}
.page.admin .comment p {
  margin:9px 0 0;
  font-size:15px;
  line-height:1.55;
  color:#3d4762;
  overflow-wrap:anywhere;
}
.page.admin .comment-controls {flex-shrink:0;gap:6px;}
.page.admin [data-hide] {
  background:#f4f1fd;
  color:#6751b8;
  border:1px solid #e4dcf6;
}
.page.admin [data-hide].selected {
  background:#eeeff2;
  color:#586075;
  border-color:#e0e3e8;
}
.page.admin [data-del] {
  border:1px solid #f4d7db;
  color:#bf465c;
  background:#fff6f7;
}
@media (max-width:1100px) {
  .page.admin .admin-grid {grid-template-columns:minmax(205px,27%) minmax(0,1fr);}
  .page.admin .admin-grid > .panel {padding:14px;}
  .page.admin .admin-list button {font-size:12.5px;}
  .page.admin .five button {min-height:102px;padding:9px;}
}
@media (max-width:850px) {
  /* iPad 가로 1024px 유지, 그보다 좁은 화면만 세로 적응 */
  .page.admin .top {flex-wrap:wrap;padding:14px;}
  .page.admin .stats {grid-template-columns:repeat(2,minmax(0,1fr));}
  .page.admin .five {grid-template-columns:repeat(3,minmax(0,1fr));}
  .page.admin .admin-grid {grid-template-columns:1fr;}
  .page.admin .admin-list {grid-template-columns:repeat(2,minmax(0,1fr));}
  .page.admin .admin-list h3 {grid-column:1/-1;}
  .page.admin .admin-grid > section.panel > .bar-title {align-items:flex-start;}
}
@media (max-width:560px) {
  .page.admin .top {align-items:flex-start;}
  .page.admin .actions {width:100%;}
  .page.admin .stats {grid-template-columns:1fr;}
  .page.admin .five {grid-template-columns:repeat(2,minmax(0,1fr));}
  .page.admin .admin-list {grid-template-columns:1fr;}
  .page.admin .stat {min-height:62px;}
  .page.admin .comment-controls .btn.tiny {font-size:12px;padding:7px 8px;}
}


/* ===========================================================
   교사용 상황판 컴팩트 v2: 더 많은 댓글을 한눈에 보기
   기존 Firebase/댓글관리 이벤트와 화면 구조는 유지합니다.
   =========================================================== */
.page.admin .top {
  min-height:66px;
  padding:9px 18px;
  margin-bottom:10px;
}
.page.admin .brand {font-size:clamp(22px,2.1vw,28px)}
.page.admin .brand small {margin-top:2px;font-size:11px}
.page.admin > .panel {
  padding:12px 15px 12px;
  margin-bottom:10px !important;
}
.page.admin > .panel > .bar-title {margin-bottom:8px}
.page.admin .bar-title h3 {font-size:16px}
.page.admin .stats {
  grid-template-columns:minmax(280px,330px) minmax(225px,285px);
  gap:10px;
  margin-bottom:7px;
}
.page.admin .stat {
  min-height:51px;
  padding:7px 10px;
  gap:8px;
  font-size:13px;
  border-radius:11px;
}
.page.admin .stat strong {font-size:clamp(22px,2.15vw,27px)}
.page.admin #target {height:36px;padding:5px 6px;border-radius:9px}
.page.admin [data-action="target"] {min-height:36px;padding:7px 11px;border-radius:9px}
.page.admin > .panel > h3 {margin:5px 0 7px;font-size:14px}
.page.admin .five {gap:8px}
.page.admin .five button {
  min-height:81px;
  padding:7px 9px;
  border-radius:11px;
}
.page.admin .five button strong {font-size:12px;line-height:1.35}
.page.admin .five .count {font-size:17px;margin-top:1px}
.page.admin .five .progress {height:6px;margin-top:3px}
.page.admin .admin-grid {gap:11px}
.page.admin .admin-grid > .panel {padding:13px}
.page.admin .admin-list {gap:6px}
.page.admin .admin-list h3 {font-size:17px;margin:0 0 4px}
.page.admin .admin-list button {min-height:51px;padding:9px 10px}
.page.admin .admin-grid > section.panel > .bar-title {
  padding-bottom:9px;
  margin-bottom:9px;
}
.page.admin .comment {
  padding:9px 11px;
  margin-bottom:6px;
  border-radius:11px;
}
.page.admin .comment .avatar {width:33px;height:33px}
.page.admin .comment .reply-head {gap:7px}
.page.admin .comment .reply-head strong {font-size:13px}
.page.admin .comment p {font-size:14px;line-height:1.45;margin:4px 0 0}
.page.admin .comment-controls .btn.tiny {min-height:36px;padding:7px 9px}
/* 교사가 댓글을 빠르게 훑을 수 있는 콤팩트 한 줄 목록 */
.page.admin .comment {
  display:grid;
  grid-template-columns:minmax(117px,23%) minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
  min-height:54px;
  padding:8px 10px;
}
.page.admin .comment .comment-row {display:contents}
.page.admin .comment .reply-head {
  grid-column:1;
  grid-row:1;
  min-width:0;
  flex-wrap:nowrap;
  margin:0;
}
.page.admin .comment .reply-head strong {
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.page.admin .comment .avatar {width:31px;height:31px}
.page.admin .comment p {
  grid-column:2;
  grid-row:1;
  margin:0;
  min-width:0;
  font-size:14px;
  line-height:1.43;
}
.page.admin .comment .comment-controls {grid-column:3;grid-row:1;gap:5px}
.page.admin .comment .comment-controls .btn.tiny {font-size:12px;padding:7px 8px}
@media (max-width:650px) {
  .page.admin .comment {grid-template-columns:minmax(0,1fr) auto}
  .page.admin .comment .reply-head {grid-column:1;grid-row:1}
  .page.admin .comment p {grid-column:1 / -1;grid-row:2}
  .page.admin .comment .comment-controls {grid-column:2;grid-row:1}
}
@media (max-width:850px) {
  .page.admin .stats {grid-template-columns:repeat(2,minmax(0,1fr))}
  .page.admin .five {grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px) {
  .page.admin .stats {grid-template-columns:1fr}
  .page.admin .five {grid-template-columns:repeat(2,minmax(0,1fr))}
}


/* 교사용 PC 우선 v3: 상단 상황판 더 짧게, 댓글 목록은 일렬 가독성 우선 */
@media(min-width:851px){
  .page.admin .top{min-height:58px;padding:8px 16px;margin-bottom:8px}
  .page.admin > .panel{padding:10px 14px 10px;margin-bottom:8px!important}
  .page.admin > .panel > .bar-title{margin-bottom:6px}
  .page.admin .stats{margin-bottom:5px;gap:8px}
  .page.admin .stat{min-height:44px;padding:5px 9px}
  .page.admin .stat strong{font-size:25px}
  .page.admin #target{height:32px}
  .page.admin [data-action="target"]{min-height:32px;padding:5px 10px}
  .page.admin > .panel > h3{margin:3px 0 5px}
  .page.admin .five{gap:7px}
  .page.admin .five button{min-height:67px;padding:7px 9px}
  .page.admin .five button strong{font-size:12px;line-height:1.25;-webkit-line-clamp:1;white-space:nowrap;text-overflow:ellipsis;max-width:100%}
  .page.admin .five .count{font-size:16px;margin-top:2px}
  .page.admin .five .progress{height:5px;margin-top:2px}
  .page.admin .admin-grid{grid-template-columns:minmax(235px,24%) minmax(0,1fr);gap:10px}
  .page.admin .admin-grid > .panel{padding:11px 13px}
  .page.admin .admin-list button{min-height:45px;padding:7px 10px}
  .page.admin .admin-grid > section.panel > .bar-title{margin-bottom:7px;padding-bottom:6px}
  .page.admin .admin-grid > section.panel > .bar-title h2{font-size:20px}

.student-top{min-height:64px;padding:10px 18px;border:1px solid rgba(225,217,234,.95);border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 5px 19px rgba(102,77,105,.065);display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:15px}
.student-brand{font-size:clamp(21px,2vw,28px);font-weight:850;letter-spacing:-.06em;display:flex;align-items:center;gap:9px;color:#273052;white-space:nowrap}

.student-identity{display:flex;gap:10px;align-items:center;background:rgba(246,242,254,.95);border:1px solid #e9e2f2;padding:5px 11px 5px 6px;border-radius:50px;white-space:nowrap;font-weight:700;font-size:14px;color:#4f4774}
.student-identity .avatar{width:36px;height:36px}
.entry-grid{display:grid;grid-template-columns:minmax(300px,54%) minmax(290px,1fr);align-items:center;gap:clamp(22px,4vw,55px);min-height:calc(100svh - 48px)}

.entry-copy .eyebrow,.profile-card .eyebrow{display:inline-block;border-radius:50px;background:#f3eafd;color:#7866a9;font-size:12px;font-weight:800;padding:7px 14px;letter-spacing:.02em}
.entry-copy h1{font-size:clamp(38px,4.8vw,68px);font-weight:900;letter-spacing:-.08em;margin:15px 0 11px;color:#2d2a4a;line-height:1.13}
.entry-copy h2{font-size:clamp(28px,3vw,39px);font-weight:900;letter-spacing:-.06em;margin:12px 0}
.entry-copy p{color:#6e6d83;line-height:1.7;margin:0 0 18px}
.entry-copy .stack{margin-top:22px}
.entry-copy .btn{width:100%;min-height:63px;font-size:18px;text-align:center;border-radius:17px}
.entry-copy .btn + .btn{margin-top:5px}
.entry-copy .teacher-choice{background:rgba(255,255,255,.95);border-color:#ded9e7;color:#65607d}

.entry-class-grid{display:grid;gap:10px;margin-top:22px}
.entry-class-grid .btn{width:100%;min-height:64px;font-size:19px}
.profile-layout{min-height:calc(100svh - 120px);display:flex;align-items:center;justify-content:center;padding:20px 0}
.profile-card{width:min(760px,100%);padding:clamp(24px,4vw,40px)!important;display:grid;grid-template-columns:1fr 210px;gap:18px;align-items:center}
.profile-card h2{font-size:clamp(24px,2.8vw,34px);letter-spacing:-.05em;margin:14px 0 10px}

.profile-decor{width:210px;max-width:100%;filter:drop-shadow(0 15px 16px rgba(148,81,107,.13));pointer-events:none}
.feed-lead{padding:15px 5px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}

.feed-board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.feed-tile{appearance:none;padding:0!important;overflow:hidden;text-align:left!important;display:flex!important;flex-direction:column;min-width:0;cursor:pointer;min-height:310px;}
.feed-tile .feed-art{height:150px;width:100%;object-fit:cover;object-position:center 50%;background:linear-gradient(130deg,#fff9f1,#f5f1fd)}
.feed-tile .tile-content{padding:18px 19px 17px;display:flex;flex:1;flex-direction:column;gap:8px}

.feed-tile h3{font-size:18px;letter-spacing:-.04em;line-height:1.4;margin:0;color:#263053}

.student-writing{display:grid;grid-template-columns:minmax(0,46%) minmax(0,54%);gap:15px;align-items:start}
.story-column,.reply-column{min-width:0}
.back-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.page.student .back-strong{background:#fff;border:2px solid #d5c2f0;color:#614db0;box-shadow:0 5px 13px rgba(90,68,125,.1);font-size:15px;font-weight:900;padding:13px 17px;min-height:53px}
.story-post{padding:0!important;overflow:hidden}
.story-post .story-copy{padding:clamp(21px,2.2vw,29px) clamp(19px,2.3vw,30px) 14px}
.story-person{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.story-person .story-person-icon{width:38px;height:38px;display:grid;place-items:center;background:#f0ebfb;border-radius:50%;color:#8a6fb9;font-size:20px}
.story-person strong{display:block;font-size:14px;letter-spacing:-.02em}.story-person small{font-size:12px;color:#8790a0}
.story-post .story-label{font-size:12px;color:#8a6ab6;font-weight:800;letter-spacing:.02em}
.story-post h2{margin:9px 0 12px;font-size:clamp(21px,2.15vw,29px);letter-spacing:-.045em;line-height:1.39}
.story-post .story-body{max-height:min(40svh,410px);overflow:auto;white-space:pre-line;font-size:clamp(14px,1.15vw,17px);line-height:1.75;color:#333f60;padding-right:6px;scrollbar-color:#dad0e8 transparent}
.story-scene{height:clamp(145px,23svh,235px);background:#fffaf5;overflow:hidden;position:relative;border-top:1px solid #eee5e2}

.reply-panel{padding:clamp(18px,2.4vw,30px)!important;position:relative;}

.reply-headline h2{font-size:clamp(21px,2.3vw,30px);margin:0;letter-spacing:-.05em}
.reply-panel .intro{color:#74748b;font-size:14px;margin:7px 0 18px}

.reply-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}

.reply-status{font-size:13px;color:#817f93}

.page.student .avatar{object-fit:contain}
@media(max-width:1090px){.student-writing{grid-template-columns:minmax(0,48%) minmax(0,52%);gap:11px}.feed-board{grid-template-columns:repeat(2,minmax(0,1fr))}.story-post .story-copy{padding:18px}.story-post .story-body{max-height:45svh}.reply-graphic{width:65px;height:65px;opacity:.65}}

/* ========== 교사용 PC / 칠판 화면 v2 (학생 화면 CSS는 변경하지 않음) ========== */
.page.admin [data-action="resume-students"] {
  background:#ebf8f2; border:1px solid #bce8d3; color:#126c53;
  box-shadow:0 3px 11px rgba(31,111,89,.10);
  font-size:14px;font-weight:800;min-height:44px;
}
.page.admin [data-action="resume-students"]:hover {background:#ddf2e8}
/* 발표 화면: 좁고 높은 왼쪽 사연 + 넓은 오른쪽 댓글 */
.page.board {max-width:1800px; padding:clamp(12px,1.5vw,22px); min-width:0;}
.page.board .top{margin-bottom:8px;gap:14px}
.page.board .brand{font-size:clamp(24px,2.2vw,35px)}
.page.board .board-tabs{margin:8px 0 13px;gap:9px}
.page.board .board-tabs .btn{min-height:43px}
.page.board .grid-two.board{
  display:grid;
  grid-template-columns:minmax(270px,26%) minmax(0,1fr);
  align-items:stretch;
  gap:16px;
  height:calc(100dvh - 182px);
  min-height:490px;
  min-width:0;
}
.page.board .grid-two.board > * {min-width:0; min-height:0;}
.page.board .story-post{
  display:flex;flex-direction:column;min-height:0;height:100%;
  overflow:hidden;padding:0;
}
.page.board .story-post .story-copy{
  flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:20px 22px 10px;
}
.page.board .story-post h2{font-size:clamp(21px,1.75vw,30px);line-height:1.34;overflow-wrap:anywhere}
.page.board .story-post .story-body{
  max-height:none;overflow:visible;line-height:1.7;
  font-size:clamp(15px,1.12vw,19px);overflow-wrap:anywhere;
}
.page.board .story-post .story-scene{
  flex:0 0 25%;height:25%;min-height:145px;max-height:245px;
  border-top:1px solid #f0e8e3;
}
.page.board .grid-two.board > section.panel {
  display:flex;flex-direction:column;height:100%;min-height:0;
  padding:20px 22px;overflow:hidden;
}
.page.board .grid-two.board > section.panel > h2 {
  flex:none;margin:0 0 16px;line-height:1.3;
  font-size:clamp(24px,2.1vw,35px);
}
.page.board .board-replies {
  flex:1 1 0;min-height:0;max-height:none;
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;align-content:start;
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  padding:3px 7px 16px 2px;
}
.page.board .board-replies > *, .page.board .board-replies .comment,
.page.board .board-replies .reply-head {min-width:0;max-width:100%;}
.page.board .board-replies .comment {margin:0;padding:15px 17px;}
.page.board .board-replies .comment strong {overflow-wrap:anywhere;}
.page.board .board-replies .comment p {
  margin:8px 0 0; white-space:pre-wrap;
  overflow-wrap:anywhere; word-break:break-word;
  max-width:100%; min-width:0;
  line-height:1.5; font-size:clamp(17px,1.35vw,23px);
}
/* small desktops and tablets viewing the presentation horizontally */
@media (max-width:1050px){
  .page.board .grid-two.board{grid-template-columns:minmax(245px,28%) minmax(0,1fr);min-height:430px;gap:10px}
  .page.board .grid-two.board > section.panel{padding:15px 13px}
  .page.board .story-post .story-copy{padding:13px}
  .page.board .board-replies .comment{padding:11px}
}
@media (max-width:700px){
  .page.board .grid-two.board{height:auto;min-height:0;display:block}
  .page.board .story-post{height:auto;max-height:65vh;margin-bottom:13px}
  .page.board .story-post .story-copy{overflow-y:auto}
  .page.board .story-post .story-scene{height:130px;min-height:130px;flex:none}
  .page.board .grid-two.board > section.panel{height:65vh;min-height:340px}
  .page.board .board-replies{grid-template-columns:1fr}
}

/* 교사용: 현황판을 높이지 않고 왼쪽 메뉴 끝에 안전한 초기화 조작을 배치 */

async function allocateAvatar(){
  let existing;
  try {existing=await getDoc(participantDoc(sClass(cls),uid));}
  catch(e){throw new Error('프로필 기록 조회 실패 ('+(e.code||e.message)+'). Firebase 규칙에서 mm2_participants 접근을 확인해야 해요.');}
  if(existing.exists()&&existing.data().avatarId)return existing.data().avatarId;
  const order=Array.from({length:24},(_,i)=>i+1).sort(()=>Math.random()-.5);
  for(const a of order){
    try{
      return await runTransaction(db,async tx=>{
        const slot=doc(db,'mm2_avatar_slots',`${sClass(cls)}_${a}`);
        const state=await tx.get(slot);
        if(state.exists()&&state.data().uid!==uid)throw new Error('occupied');
        tx.set(slot,{uid,classId:sClass(cls)});
        tx.set(participantDoc(sClass(cls),uid),{userId:uid,classId:sClass(cls),avatarId:a},{merge:true});
        return a;
      });
    }catch(e){
      if(e.message==='occupied')continue;
      throw new Error('프로필 배정 저장 실패 ('+(e.code||e.message)+'). Firebase 규칙에서 mm2_avatar_slots 및 mm2_participants 쓰기를 확인해야 해요.');
    }
  }
  throw new Error('이 반의 프로필 24개가 모두 배정되었습니다.');
}

    let teacherAccount=auth.currentUser;
    if(!teacherAccount||teacherAccount.isAnonymous||teacherAccount.uid!==MAILBOX_TEACHER_UID){
      const email=prompt('교사용 Firebase 이메일을 입력하세요.');
      if(!email)return;
      const password=prompt('교사용 Firebase 비밀번호를 입력하세요.');
      if(!password)return;
      try {
        const login=await signInWithEmailAndPassword(auth,email,password);
        teacherAccount=login.user;
      } catch(loginError){
        throw new Error('교사 로그인 실패: '+(loginError.code||loginError.message));
      }
    }
    if(teacherAccount.uid!==MAILBOX_TEACHER_UID){
      throw new Error('현재 Google 계정은 초기화 권한이 있는 교사 계정과 다릅니다. 기존 우리반 약국에 등록된 교사 Google 계정으로 로그인해 주세요. (현재 UID: '+teacherAccount.uid+')');
    }

      getDocs(comments()),getDocs(participantCollection()),
      Promise.all(Array.from({length:24},(_,i)=>getDoc(doc(db,'mm2_avatar_slots',`${classId}_${i+1}`))))
    ]);
    const docs=[
      ...cSnap.docs.filter(d=>d.data().classId===classId && STORIES.some(s=>s.id===d.data().storyId) && d.id.startsWith(String(selected)+'_')),
      ...pSnap.docs.filter(d=>d.data().classId===classId),
      ...slots.filter(d=>d.exists()&&d.data().classId===classId)
    ];
    if(docs.length+1>500)throw new Error('삭제할 기록이 499개를 초과합니다. 안전을 위해 초기화를 중단했어요.');
    if(cls!==selected)throw new Error('선택한 반이 바뀌어 초기화를 취소했어요.');
    const batch=writeBatch(db), stamp=Date.now();
    for(const row of docs)batch.delete(row.ref);
    batch.set(sessionDoc(classId),{phase:'writing',target:0,snapshot:[],boardStory:0,updatedAt:stamp,resetAt:stamp});
    await batch.commit();
    if(cls===selected){

      localStorage.removeItem('mm2_nick_'+selected+'_'+uid);
      localStorage.removeItem('mm2_avatar_'+selected+'_'+uid);
      localStorage.setItem('mm2_reset_seen_'+selected+'_'+uid,String(stamp));
      nick='';avatarId=0;nav('admin');
    }
    alert(`6학년 ${selected}반의 활동 기록을 초기화했어요. 다른 반은 그대로 유지됩니다.`);
  }catch(e){console.error('현재 반 초기화 실패',e);const hint=e.code==='permission-denied'?'\nFirebase Firestore 규칙의 mm2_participants/mm2_avatar_slots 삭제 권한을 교사 UID로 변경했는지 확인해 주세요.':'';alert('초기화하지 못했어요. 기존 데이터는 유지됩니다.\n원인: '+(e.code||e.message)+hint);}
  finally{if(button.isConnected)button.disabled=false;}
}
function pinGate(next){const layer=document.createElement('div');layer.className='dialog';layer.innerHTML=`<div class="panel"><h2>🔒 교사용 모드</h2><p class="muted">교사용 비밀번호를 입력해 주세요.</p><input id="pin" class="input" type="password" inputmode="numeric" maxlength="4"><div class="actions"><button class="btn primary" id="enter">입장</button><button class="btn" id="cancel">취소</button></div><p id="pin-error" style="color:#b74f66"></p></div>`;document.body.append(layer);layer.querySelector('#cancel').onclick=()=>layer.remove();const check=()=>{if(layer.querySelector('#pin').value==='0504'){layer.remove();teacher=true;next();}else{layer.querySelector('#pin-error').textContent='비밀번호를 확인해 주세요.'}};layer.querySelector('#enter').onclick=check;layer.querySelector('#pin').onkeydown=e=>{if(e.key==='Enter')check()};layer.querySelector('#pin').focus();}

function bind(){const ac=document.getElementById('admin-class');if(ac)ac.onchange=()=>{attachClass(Number(ac.value));watchParticipants();nav('admin')};app.querySelectorAll('[data-class]').forEach(b=>b.onclick=()=>{attachClass(Number(b.dataset.class));teacherClass=cls;if(teacher){watchParticipants();nav('admin')}else nav(nick?'feed':'profile')});app.querySelectorAll('[data-story]').forEach(b=>b.onclick=()=>{storyIdx=Number(b.dataset.story);nav(teacher?'admin':'write')});app.querySelectorAll('[data-board-story]').forEach(b=>b.onclick=async()=>{if(!teacher)return;const next=Number(b.dataset.boardStory);if(!Number.isInteger(next)||next<0||next>=STORIES.length)return;const previous=Number(settings.boardStory)||0;settings.boardStory=next;render();try{await setDoc(sessionDoc(sClass(cls)),{boardStory:next},{merge:true})}catch(e){console.error(e);settings.boardStory=previous;render();alert('고민 이동 저장 실패: '+(e.code||e.message))}});app.querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{const c=commentsCache.find(c=>c.id===b.dataset.hide);if(!c)return;try{await setDoc(commentDoc(c.id),{hidden:!c.hidden},{merge:true})}catch(e){alert('미공개 변경 실패: '+e.message)}});app.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('이 댓글을 삭제할까요?'))return;try{await deleteDoc(commentDoc(b.dataset.del))}catch(e){alert('삭제 실패: '+e.message)}});app.querySelectorAll('[data-action]').forEach(b=>{if(['student','teacher'].includes(b.dataset.action))return;b.onclick=()=>handle(b.dataset.action,b)});}
async function handle(a,button){try{if(a==='reset-class'){pinGate(()=>resetCurrentClass(button));return;}if(a==='student'){teacher=false;if(!cls){nav('class')}else{attachClass(cls);nav(nick?'feed':'profile')} }if(a==='teacher'){pinGate(()=>{if(!cls){nav('class')}else{attachClass(cls);watchParticipants();nav('admin')}})}if(a==='edit-nick')nav('profile');if(a==='back-feed')nav('feed');if(a==='save-nick'){if(settings.phase==='board'&&!teacher)return nav('locked');const v=document.getElementById('nick').value.trim();if(!v||prohibited(v))return alert('닉네임을 확인해 주세요.');button.disabled=true;try{avatarId=avatarId||await allocateAvatar();nick=v;localStorage.setItem('mm2_nick_'+cls+'_'+uid,nick);localStorage.setItem('mm2_avatar_'+cls+'_'+uid,String(avatarId));nav('feed')}finally{button.disabled=false}}if(a==='send'){if(settings.phase==='board')return nav('locked');const s=STORIES[storyIdx],text=document.getElementById('reply').value.trim();if(!text||prohibited(text))return alert('따뜻한 표현으로 댓글을 작성해 주세요.');button.disabled=true;try{const m=mine(s);await setDoc(commentDoc(m?.id||`${cls}_${uid}_${s.id}`),{classId:sClass(cls),storyId:s.id,nickname:nick,avatarId,userId:uid,text,ts:Date.now(),hidden:m?.hidden||false},{merge:true});nav('feed')}finally{button.disabled=false}}if(a==='target'){await setDoc(sessionDoc(sClass(cls)),{target:Math.max(0,Number(document.getElementById('target').value)||0)},{merge:true})}if(a==='publish'){if(!confirm('댓글 검토를 마치고 칠판 화면으로 전환할까요? 학생들의 작성도 종료됩니다.'))return;button.disabled=true;const snapshot=commentsCache.filter(c=>!c.hidden).map(c=>({storyId:c.storyId,nickname:c.nickname,avatarId:c.avatarId||1,text:c.text,id:c.id}));await setDoc(sessionDoc(sClass(cls)),{phase:'board',snapshot,boardStory:storyIdx,updatedAt:Date.now()},{merge:true});nav('board')}if(a==='resume-students'){pinGate(async()=>{try{button.disabled=true;await setDoc(sessionDoc(sClass(cls)),{phase:'writing',snapshot:[],updatedAt:Date.now()},{merge:true});settings.phase='writing';settings.snapshot=[];watchParticipants();nav('admin');}catch(err){console.error(err);alert('학생 댓글 활동 재개 실패: '+(err.code||err.message));button.disabled=false;}})}if(a==='admin-again')pinGate(()=>{watchParticipants();nav('admin')});}catch(e){console.error(e);alert('작업을 완료하지 못했어요: '+(e.code||'')+' '+e.message);if(button)button.disabled=false}}

ine-height:1.55;letter-spacing:-.02em;word-break:keep-all;overflow:auto;scrollbar-width:thin;max-height:100%;padding:10px 110px 8px 0}.next{position:absolute;bottom:13px;right:18px;border:1px solid #f0daa4;background:#f0daa4;color:#23384e;border-radius:13px;font-size:16px;font-weight:800;padding:10px 20px;min-height:43px}.next:focus-visible{outline:3px solid #8ad6ff;outline-offset:3px}/* Choice UI stays inside approved VN dialog, not drawn on background art. */

.phone-overlay.active{display:flex}

.end-scene.visible{display:flex}.end-card{background:#fff;color:#1b344e;border-radius:18px;padding:26px;max-width:520px;display:grid;gap:14px}

@media (max-width:900px){
 .character{height:min(83%,650px);max-width:66%;bottom:2.2%;left:54%}

}

</style><link rel="stylesheet" href="scene-responsive.css?v=6"></head><body><div class="app"><header class="top"><strong>디지털 안전 탐험대 2.0 · 미션 1 도입부</strong><small>디지털 성폭력 예방 체험 이야기</small></header><main class="stage" id="sceneStage" data-scene="intro"><div class="background" aria-hidden="true"></div><img class="character" id="character" data-character="harin" src="assets/harin.png" alt="하린 캐릭터"><section class="dialog" aria-label="비주얼 노벨 대화창"><span class="name" id="speaker">하린</span><div class="line" id="line" aria-live="polite"></div><div class="choice-prompt" id="choicePrompt" aria-live="polite"></div><div class="choices" id="choices"><button class="choice" type="button" data-choice="A"></button><button class="choice" type="button" data-choice="B"></button></div><button class="next" id="next" type="button" aria-label="다음 대사 보기">다음 ▾</button></section></main></div><div class="phone-overlay" id="phoneOverlay"><div class="phone-title">MISSION 1 · 게임 친구와의 채팅</div><iframe class="phone-frame" id="phoneFrame" title="미션 1 휴대폰 채팅" allow="clipboard-read; clipboard-write"></iframe></div>
<script src="expression-sprites.js?v=7"></script>
<script src="progress.js?v=16"></script><script>
// This is a scene-integration preview. Existing phone mission, AI and judge files remain unmodified.
const INTRO=[
 {speaker:'하린',text:'너 요즘 게임에서 친해진 친구랑 자주 연락한다며?'},
 {speaker:'주인공',text:'응! 같이 게임도 하고 거의 매일 채팅해.'},
 {speaker:'하린',text:'오~ 꽤 친해졌나 보네!'},
 {speaker:'주인공',text:'응! 이제 진짜 친구 같아.'},
 {speaker:'효과음',text:'띠링!'},
 {speaker:'주인공',text:'어? 마침 그 친구한테 메시지가 왔네!'}
];
const TEACHER=[
 {speaker:'주인공',text:'휴… 이상한 사람이었어. 이제 어떻게 하지?'},
 {speaker:'주인공',text:'선생님, 잠깐 말씀드려도 돼요?'},
 {speaker:'선생님',text:'그럼, 무슨 일이니?'},
 {speaker:'장면 연출',text:'주인공이 조금 전 게임 친구에게 받은 메시지에 관해 선생님께 말씀드린다.'},
 {speaker:'선생님',text:'혼자 고민하지 않고 이야기해 줘서 고마워. 이런 일이 생기면 꼭 도움을 요청하렴.'},
 {speaker:'주인공',text:'네! 선생님께 말씀드리니까 안심이 돼요.'}
];
const stage=document.getElementById('sceneStage'),speaker=document.getElementById('speaker'),line=document.getElementById('line'),next=document.getElementById('next');
const dialog=document.querySelector('.dialog'),sprite=document.getElementById('character');
const overlay=document.getElementById('phoneOverlay'),frame=document.getElementById('phoneFrame');
let part='intro',idx=0,ready=false,pending=false,delayTeacherUntil=1,phoneStep=0;
const storedM1=DSProgress.get();
if(storedM1?.page==='mission1.html'){
 const d=storedM1.data||{};
 if(['intro','chat','teacher'].includes(d.part))part=d.part;
 idx=Number.isInteger(d.idx)?Math.max(0,d.idx):0;
 phoneStep=Number.isInteger(d.phoneStep)?Math.max(0,d.phoneStep):0;
 if(d.routeB){TEACHER.splice(1,0,{speaker:'주인공 속마음',text:'대화도 끝냈으니까 괜찮겠지?'},{speaker:'주인공 속마음',text:'그런데 또 연락이 오면? 혼자 해결하지 말고 말씀드리자.'});delayTeacherUntil=3;}
 idx=Math.min(idx,(part==='intro'?INTRO:TEACHER).length-1);
}
function saveM1(){DSProgress.save('mission1.html',{part,idx,phoneStep,routeB:delayTeacherUntil===3})}

function syncTeacherScene(){
 if(part!=='teacher')return;
 const decision=idx<delayTeacherUntil;
 stage.dataset.scene=decision?'decision':'teacher';
 if(!decision){sprite.src='assets/teacher.png';sprite.dataset.character='teacher';sprite.alt='선생님 캐릭터';}
}
function render(){syncTeacherScene();const item=(part==='intro'?INTRO:TEACHER)[idx];speaker.textContent=item.speaker;line.textContent=item.text;if(part==='intro'){DSExpressions.set(sprite,'harin',idx>=4?'worry':'smile')}else if(stage.dataset.scene==='teacher'){DSExpressions.set(sprite,'teacher',idx>=4?'smile':'listening')}const isChoice=part==='teacher'&&idx===0;dialog.classList.toggle('is-choice',isChoice);if(isChoice){document.getElementById('choicePrompt').textContent=item.text;document.getElementById('choices').querySelector('[data-choice="A"]').textContent='선생님께 말씀드리러 간다';document.getElementById('choices').querySelector('[data-choice="B"]').textContent='그냥 집에 간다';}next.textContent=idx===(part==='intro'?INTRO:TEACHER).length-1?(part==='intro'?'휴대폰 열기 ▾':'다음 ▾'):'다음 ▾';scheduleClip();saveM1();}
function chooseTeacher(route){if(part!=='teacher'||idx!==0)return;dialog.classList.remove('is-choice');if(route==='B'){TEACHER.splice(1,0,{speaker:'주인공 속마음',text:'대화도 끝냈으니까 괜찮겠지?'},{speaker:'주인공 속마음',text:'그런데 또 연락이 오면? 혼자 해결하지 말고 말씀드리자.'});delayTeacherUntil=3;}else{delayTeacherUntil=1;}idx=1;render();}
document.querySelectorAll('[data-choice]').forEach(b=>b.addEventListener('click',()=>chooseTeacher(b.dataset.choice)));
function advance(){if(part==='teacher'&&idx===0)return;if(part==='intro'){if(idx<INTRO.length-1){idx++;render()}else{startChat()}}else if(part==='teacher'){if(idx<TEACHER.length-1){idx++;render()}else{part='done';location.href='mission2.html'}}}
function startChat(){part='chat';saveM1();overlay.classList.add('active');pending=true;if(ready){frame.contentWindow.postMessage({type:'DS_AI_START',mission:1,resumeStep:phoneStep},'*');pending=false}else{frame.src='offline_chat.html?v=08&layout=ipad5'}}
function resumeTeacher(){overlay.classList.remove('active');part='teacher';idx=0;delayTeacherUntil=1;render()}
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||!event.data)return;
 if(event.data.type==='DS_CHAT_PROGRESS'&&event.data.mission===1){phoneStep=event.data.step;saveM1();}
 if(event.data.type==='DS_CHAT_READY'){ready=true;if(pending){frame.contentWindow.postMessage({type:'DS_AI_START',mission:1,resumeStep:phoneStep},'*');pending=false}}
 if(event.data.type==='DS_AI_FINISH'&&event.data.mission===1&&part==='chat')resumeTeacher();});
next.addEventListener('click',()=>{if(part==='intro'||part==='teacher')advance()});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key==='ArrowRight')&&!['BUTTON','INPUT','TEXTAREA'].includes(e.target.tagName)&&overlay.classList.contains('active')===false){advance()}});
let clipFrame=0;
function scheduleClip(){cancelAnimationFrame(clipFrame);clipFrame=requestAnimationFrame(()=>{sprite.style.setProperty('--sprite-hide-bottom','0px');const r=sprite.getBoundingClientRect(),d=dialog.getBoundingClientRect();sprite.style.setProperty('--sprite-hide-bottom',Math.max(0,Math.min(sprite.offsetHeight,(r.bottom-(d.top+8))*(sprite.offsetHeight/Math.max(1,r.height)))).toFixed(1)+'px')})}
sprite.addEventListener('load',scheduleClip);window.addEventListener('resize',scheduleClip);window.visualViewport?.addEventListener('resize',scheduleClip);if(part==='chat')startChat();else render();
</script><script src="scene-responsive.js?v=6"></script></body></html>

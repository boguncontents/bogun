const appInstance = initializeApp(firebaseConfig);
const auth = getAuth(appInstance);
const db = getFirestore(appInstance);

let userId = null;
let dbReady = false;
let dbFailed = false;

function getPublicCollection(collectionName) {
  return collection(db, 'artifacts', appId, 'public', 'data', collectionName);
}

function getPublicDoc(collectionName, documentId) {
  return doc(db, 'artifacts', appId, 'public', 'data', collectionName, documentId);
}

async function initAuth() {
  try {
    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
      await signInWithCustomToken(auth, __initial_auth_token);
    } else {
      await signInAnonymously(auth);
    }
  } catch (e) {
    console.warn("Custom token failed, trying anonymous auth:", e);
    try {
      await signInAnonymously(auth);
    } catch(err) {
      console.error("Anonymous auth failed:", err);
      dbFailed = true;
      render();
    }
  }
}

onAuthStateChanged(auth, (user) => {
  if (user) {
    userId = user.uid;
    dbReady = true;
    dbFailed = false;
    render();
    if (view.startsWith('teacher') && view !== 'teacher-class') {
      startTeacherListen();
    }
  }
});

];

function normalizeForFilter(str){
  return str.replace(/\s+/g,'').toLowerCase();
}
function containsBadWord(str){
  const norm = normalizeForFilter(str);
  return BAD_WORDS.some(w => norm.includes(normalizeForFilter(w)));
}

function classInputBlock(onGo){
  const wrap = el(`
    <div class="w-full max-w-sm fade-in mt-6">
      <button class="text-xs font-semibold mb-4 flex items-center gap-1" style="color:var(--text-muted)" id="back">

        <div class="space-y-2.5" id="classBtns"></div>
      </div>
    </div>
  `);
  wrap.querySelector('#back').onclick = () => { view='landing'; render(); };
  const btnBox = wrap.querySelector('#classBtns');
  CLASS_OPTIONS.forEach(name => {
    const isSelected = name === classId;
    const b = el(`
      <button class="w-full py-3.5 px-4 rounded-xl text-base font-bold flex items-center justify-between transition-all ${isSelected ? 'btn-sns' : 'sns-card hover:border-indigo-400'}">
        <span>${name} 피드</span>
        <span class="text-xs font-normal opacity-80">${isSelected ? '선택됨 ✓' : '입장하기 →'}</span>
      </button>
    `);
    b.onclick = () => {
      classId = name;
      localStorage.setItem('mm_last_class', classId);
      onGo();
    };
    btnBox.appendChild(b);
  });
  return wrap;
}

  }));
}

          <div>
            <p class="text-xs font-bold">${studentNick}</p>
            <p class="text-[11px]" style="color:var(--text-muted)">익명 댓글 작성자로 참여 중</p>
          </div>
        </div>
        <button id="changeNick" class="text-xs font-medium px-2.5 py-1 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800" style="color:var(--brand-primary)">
          수정
        </button>
      </div>

      <div class="flex items-center justify-between mb-3 px-1">
        <h2 class="text-base font-bold flex items-center gap-2">
          <span>💬</span> 고민 포스트 피드 (${doneCount}/${STORIES.length} 완료)
        </h2>
      </div>

      <!-- Feed Cards List -->
      <div class="space-y-4" id="list"></div>
    </div>
  `);

  const list = wrap.querySelector('#list');
  STORIES.forEach((s, idx) => {
    const done = !!answered[s.id];
    const item = el(`
      <article class="sns-card p-5 cursor-pointer hover:border-indigo-300 relative group">
        <!-- Post Top Meta -->
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-2.5">
            <div class="w-9 h-9 rounded-full flex items-center justify-center text-sm" style="background:${s.avatarBg}20">
              ${s.avatarEmoji}
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-xs font-extrabold">${s.sender}</span>
                <span class="text-[11px]" style="color:var(--text-muted)">${s.handle}</span>
              </div>
              <span class="text-[10px]" style="color:var(--text-muted)">${s.timeAgo}</span>
            </div>
          </div>
          <span class="px-2.5 py-1 rounded-full text-[11px] font-semibold" style="background:var(--badge-bg); color:var(--brand-primary)">
            ${s.tag}
          </span>
        </div>

        <!-- Post Content Summary -->
        <h3 class="text-sm font-bold mb-1.5 group-hover:text-indigo-600 transition-colors">${s.title}</h3>
        <p class="text-xs line-clamp-2 leading-relaxed mb-4" style="color:var(--text-muted)">${s.text}</p>

        <!-- Social Action Footer -->
        <div class="flex items-center justify-between pt-3 border-t border-slate-100 dark:border-slate-800 text-xs">
          <div class="flex items-center gap-4 text-slate-500">
            <span class="flex items-center gap-1 text-rose-500">
              ♥ 공감하기
            </span>
            <span class="flex items-center gap-1 font-medium ${done ? 'text-emerald-600 font-bold' : ''}">
              💬 ${done ? '내 댓글 작성 완료' : '댓글로 위로 남기기'}
            </span>
          </div>
          <span class="text-[11px] font-bold text-indigo-500">
            ${done ? '수정하기 →' : '답글 달기 →'}
          </span>
        </div>
      </article>
    `);
    item.onclick = () => { currentStoryIdx = idx; view='student-story'; render(); };
    list.appendChild(item);
  });

  if (doneCount === STORIES.length) {
    const finishBtn = el(`
      <div class="mt-6 text-center">
        <button id="finishBtn" class="btn-sns w-full py-3.5 text-sm">
          🎉 모든 게시글에 따뜻한 답글을 남겼어요!
        </button>
      </div>
    `);
    finishBtn.querySelector('#finishBtn').onclick = () => { view='student-done'; render(); };
    wrap.appendChild(finishBtn);
  }

  appEl.appendChild(wrap);
  wrap.querySelector('#back').onclick = () => { view='student-class'; render(); };
  wrap.querySelector('#changeNick').onclick = () => { view='student-nick'; render(); };
}

function renderStudentStory(){
  const s = STORIES[currentStoryIdx];
  const answered = getAnswered(classId);
  const existingDocId = answered[s.id];

  const wrap = el(`
    <div class="w-full max-w-lg fade-in">
      <button class="text-xs font-semibold mb-3 flex items-center gap-1 hover:text-indigo-600" style="color:var(--text-muted)" id="back">
        ← 고민 피드로 돌아가기
      </button>

      <!-- Main Social Post Card -->
      <article class="sns-card p-5 md:p-6 mb-5">
        <!-- Header -->
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center text-base" style="background:${s.avatarBg}25">
              ${s.avatarEmoji}
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-sm font-extrabold">${s.sender}</span>
                <span class="text-xs text-slate-400">${s.handle}</span>
              </div>
              <p class="text-[11px]" style="color:var(--text-muted)">${currentStoryIdx + 1} / ${STORIES.length} 번째 게시글 · ${s.timeAgo}</p>
            </div>
          </div>
          <span class="px-2.5 py-1 rounded-full text-xs font-semibold" style="background:var(--badge-bg); color:var(--brand-primary)">
            ${s.tag}
          </span>
        </div>

        <!-- Title & Body -->
        <h2 class="text-lg font-bold mb-3">${s.title}</h2>
        <div class="text-sm leading-relaxed space-y-3 whitespace-pre-line" style="color:var(--text-primary)">
          ${s.text}
        </div>
      </article>

      <!-- Comment Section Box -->
      <div class="sns-card p-5">
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-xs font-bold flex items-center gap-1.5 text-indigo-600 dark:text-indigo-400">
            <span>💬</span> ${existingDocId ? '내가 남긴 댓글' : '따뜻한 댓글로 답변 남기기'}
          </h3>
          <span class="text-[11px]" style="color:var(--text-muted)">작성자: ${studentNick}</span>
        </div>

        <div class="flex gap-3">
          <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center text-white text-xs font-bold flex-shrink-0 mt-1">
            ${studentNick.charAt(0)}
          </div>
          <div class="flex-1 space-y-2">
            <textarea id="reply" rows="4" 
              placeholder="${s.sender}님에게 따뜻한 조언이나 위로의 한 마디를 남겨주세요..."
              class="sns-input w-full p-3 text-sm resize-none"></textarea>
            
            <div class="flex items-center justify-between pt-1">
              <span id="status" class="text-xs font-medium"></span>
              <button id="submitBtn" class="btn-sns px-5 py-2.5 text-xs font-bold">
                ${existingDocId ? '댓글 수정' : '댓글 게시'}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  `);

  appEl.appendChild(wrap);
  wrap.querySelector('#back').onclick = () => { view='student-list'; render(); };

  const replyInput = wrap.querySelector('#reply');
  const statusEl = wrap.querySelector('#status');
  const submitBtn = wrap.querySelector('#submitBtn');

  if (existingDocId && dbReady) {
    getDoc(getPublicDoc('comments', existingDocId)).then(snap => {
      if (snap.exists()) {
        const d = snap.data() || {};
        replyInput.value = d.text || '';
      }
    }).catch(e => console.error(e));
  }

  submitBtn.onclick = async () => {
    const text = replyInput.value.trim();
    if (!text) { 
      statusEl.textContent = '댓글 내용을 입력해주세요.'; 
      statusEl.style.color = '#ef4444'; 
      replyInput.focus(); 
      return; 
    }
    if (containsBadWord(text)) {
      statusEl.style.color = '#ef4444';
      statusEl.textContent = '고운 말을 사용하여 댓글을 다시 작성해주세요.';
      return;
    }
    if (!dbReady || !userId) { 
      statusEl.textContent = '서버 연결 확인 중입니다...'; 
      statusEl.style.color='#f59e0b'; 
      return; 
    }

    submitBtn.disabled = true;
    statusEl.style.color = 'var(--text-muted)';
    statusEl.textContent = '게시하는 중...';
    const nickname = studentNick || randomNick();

    try {
      if (existingDocId) {
        await setDoc(getPublicDoc('comments', existingDocId), { classId, storyId: s.id, nickname, text, userId, ts: Date.now() });
      } else {
        const ref = await addDoc(getPublicCollection('comments'), { classId, storyId: s.id, nickname, text, userId, ts: Date.now() });
        setAnswered(classId, s.id, ref.id);
      }
      statusEl.style.color = '#10b981';
      statusEl.textContent = '댓글이 정상적으로 등록되었습니다!';
      setTimeout(() => { view='student-list'; render(); }, 600);
    } catch (e) {
      console.error(e);
      statusEl.style.color = '#ef4444';
      statusEl.textContent = '저장에 실패했습니다. 다시 시도해주세요.';
      submitBtn.disabled = false;
    }
  };
}

function renderStudentDone(){
  const wrap = el(`
    <div class="w-full max-w-md fade-in mt-10 text-center">
      <div class="sns-card p-8">
        <div class="w-16 h-16 rounded-full bg-emerald-100 dark:bg-emerald-950 text-emerald-500 text-3xl flex items-center justify-center mx-auto mb-4">
          💌
        </div>
        <h2 class="text-xl font-extrabold mb-2">모든 고민에 댓글을 남겼어요!</h2>
        <p class="text-xs leading-relaxed mb-6" style="color:var(--text-muted)">
          친구들의 사연에 따뜻한 관심과 위로를 나눠주셔서 고맙습니다.<br>
          선생님 화면(칠판)에서 우리 반 아이들의 솔직한 생각을 함께 나눠보세요!
        </p>
        <button id="back" class="sns-card w-full py-3 text-xs font-bold hover:border-indigo-400">
          고민 피드 둘러보기
        </button>
      </div>
    </div>
  `);
  wrap.querySelector('#back').onclick = () => { view='student-list'; render(); };
  appEl.appendChild(wrap);
}

function renderTeacherClass(){
  focusedStoryId = null;
  confirmingReset = false;
  appEl.appendChild(classInputBlock(() => { view='teacher-board'; startTeacherListen(); render(); }));
}

function startTeacherListen(){
  if (unsub) { unsub(); unsub = null; }
  liveComments = [];
  if (!dbReady) return;
  unsub = onSnapshot(getPublicCollection('comments'),
    snap => {
      const allComments = snap.docs.map(d => ({ id: d.id, ...(d.data() || {}) }));
      liveComments = allComments.filter(c => c.classId === classId);
      if (view === 'teacher-board') renderTeacherBoard(true);
    },
    err => { console.error('Teacher listen error:', err); }
  );
}

function renderTeacherBoard(inPlace){
  if (!inPlace) appEl.innerHTML = '';
  const existing = document.getElementById('board-root');
  if (existing) existing.remove();

  const root = el(`<div id="board-root" class="w-full max-w-5xl fade-in"></div>`);
  const header = el(`
    <div class="flex items-center justify-between mb-6 flex-wrap gap-3 pb-4 border-b border-slate-200 dark:border-slate-800">
      <div>
        <button class="text-xs font-semibold mb-1 hover:text-indigo-600 block" style="color:var(--text-muted)" id="back">
          ${focusedStoryId ? '← 게시글 목록 피드로' : '← 학급 다시 선택'}
        </button>
        <h2 class="text-2xl font-extrabold flex items-center gap-2">
          <span>🧑‍🏫</span> ${classId} 실시간 고민 피드 대시보드
        </h2>
      </div>
      <div class="flex items-center gap-2">
        ${connBadge()}
        <span class="px-3 py-1 rounded-full text-xs font-bold" style="background:var(--brand-soft); color:var(--brand-primary)">
          총 ${liveComments.length}개 댓글 수신
        </span>
        ${focusedStoryId ? '' : `<button id="resetBtn" class="px-3 py-1 rounded-lg text-xs font-bold bg-rose-500 text-white hover:bg-rose-600 transition-colors" ${dbReady ? '' : 'disabled'}>기록 초기화</button>`}
      </div>
    </div>
  `);
  root.appendChild(header);

  if (confirmingReset && !focusedStoryId) {
    const confirmBox = el(`
      <div class="sns-card p-5 mb-5 border-rose-400 bg-rose-50/50 dark:bg-rose-950/20">
        <p class="font-bold text-sm text-rose-600 mb-1">${classId} 학급의 모든 댓글 (${liveComments.length}개)을 삭제하시겠습니까?</p>
        <p class="text-xs mb-3 text-slate-500">이 작업은 복구할 수 없습니다.</p>
        <div class="flex gap-2">
          <button id="confirmDeleteBtn" class="px-4 py-2 bg-rose-600 text-white rounded-lg text-xs font-bold">확인 삭제</button>
          <button id="cancelDeleteBtn" class="px-4 py-2 bg-slate-200 dark:bg-slate-800 rounded-lg text-xs font-bold">취소</button>
        </div>
      </div>
    `);
    root.appendChild(confirmBox);
    confirmBox.querySelector('#cancelDeleteBtn').onclick = () => { confirmingReset = false; renderTeacherBoard(true); };
    confirmBox.querySelector('#confirmDeleteBtn').onclick = async (ev) => {
      ev.target.disabled = true;
      const snap = await getDocs(getPublicCollection('comments'));
      for (const d of snap.docs) {
        if (d.data().classId === classId) {
          try { await deleteDoc(d.ref); } catch(e){}
        }
      }
      confirmingReset = false;
      renderTeacherBoard(true);
    };
  }

  root.querySelector('#back').onclick = () => {
    if (focusedStoryId) { focusedStoryId = null; renderTeacherBoard(true); return; }
    confirmingReset = false;
    if (unsub) unsub(); unsub=null; view='teacher-class'; render();
  };

  if (focusedStoryId) {
    root.appendChild(renderFocusedStory(focusedStoryId));
    appEl.appendChild(root);
    return;
  }

  const grid = el(`<div class="grid gap-4 md:grid-cols-2 lg:grid-cols-3"></div>`);
  STORIES.forEach(s => {
    const mine = liveComments.filter(c => c.storyId === s.id);
    const card = el(`
      <article class="sns-card p-5 cursor-pointer hover:border-indigo-400 transition-all flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="text-base">${s.avatarEmoji}</span>
              <span class="text-xs font-bold">${s.sender}</span>
            </div>
            <span class="text-[10px] px-2 py-0.5 rounded-full font-bold bg-indigo-100 dark:bg-indigo-950 text-indigo-600">
              ${s.tag}
            </span>
          </div>
          <h3 class="text-sm font-bold mb-2 leading-snug">${s.title}</h3>
          <p class="text-xs line-clamp-3 mb-4 text-slate-500">${s.text}</p>
        </div>

        <div class="pt-3 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
          <span class="text-xs font-bold text-indigo-600">
            💬 댓글 ${mine.length}개 도착
          </span>
          <span class="text-xs text-slate-400">전체 스레드 보기 →</span>
        </div>
      </article>
    `);
    card.onclick = () => { focusedStoryId = s.id; renderTeacherBoard(true); };
    grid.appendChild(card);
  });
  root.appendChild(grid);
  appEl.appendChild(root);

  const resetBtn = root.querySelector('#resetBtn');
  if (resetBtn) resetBtn.onclick = () => { confirmingReset = true; renderTeacherBoard(true); };
}

function renderFocusedStory(storyId){
  const idx = STORIES.findIndex(s => s.id === storyId);
  const s = STORIES[idx];
  const mine = liveComments.filter(c => c.storyId === s.id).sort((a,b)=> (a.ts||0)-(b.ts||0));

  const wrap = el(`
    <div>
      <!-- Main Selected Post View -->
      <article class="sns-card p-6 mb-6 border-indigo-200 dark:border-indigo-900">
        <div class="flex items-center justify-between mb-3">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full flex items-center justify-center text-lg" style="background:${s.avatarBg}25">
              ${s.avatarEmoji}
            </div>
            <div>
              <p class="text-sm font-extrabold">${s.sender} <span class="text-xs text-slate-400">${s.handle}</span></p>
              <p class="text-xs text-slate-400">${s.timeAgo}</p>
            </div>
          </div>
          <span class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-100 text-indigo-600 dark:bg-indigo-950 dark:text-indigo-400">
            ${s.tag}
          </span>
        </div>
        <h2 class="text-xl font-bold mb-3">${s.title}</h2>
        <p class="text-sm leading-relaxed whitespace-pre-line text-slate-700 dark:text-slate-300">${s.text}</p>
      </article>

      <!-- Thread Replies List -->
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-lg font-bold flex items-center gap-2">
          <span>💬</span> 실시간 학생 댓글 스레드 (${mine.length}개)
        </h3>
        <div class="flex gap-2">
          <button id="prevBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold sns-card" ${idx<=0 ? 'disabled opacity-50' : ''}>← 이전 포스트</button>
          <button id="nextBtn" class="px-3 py-1.5 rounded-lg text-xs font-bold sns-card" ${idx>=STORIES.length-1 ? 'disabled opacity-50' : ''}>다음 포스트 →</button>
        </div>
      </div>

      <div class="space-y-3 scrollbox pr-1" id="replyList"></div>
    </div>
  `);

  const replyList = wrap.querySelector('#replyList');
  if (mine.length === 0) {
    replyList.appendChild(el(`<div class="sns-card p-8 text-center text-sm text-slate-400">아직 등록된 학생 댓글이 없습니다.</div>`));
  }
  
  mine.forEach(c => {
    replyList.appendChild(el(`
      <div class="sns-card p-4">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-2">
            <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-indigo-500 to-rose-400 flex items-center justify-center text-white text-[10px] font-bold">
              ${(c.nickname||'익명').charAt(0)}
            </div>
            <span class="text-xs font-extrabold">${escapeHtml(c.nickname||'익명')}</span>
          </div>
          <button class="text-xs text-rose-500 hover:underline" data-del="${c.id}">삭제</button>
        </div>
        <p class="text-sm leading-relaxed pl-9 whitespace-pre-line">${escapeHtml(c.text||'')}</p>
      </div>
    `));
  });

  wrap.querySelector('#prevBtn').onclick = () => { if (idx>0) { focusedStoryId = STORIES[idx-1].id; renderTeacherBoard(true); } };
  wrap.querySelector('#nextBtn').onclick = () => { if (idx<STORIES.length-1) { focusedStoryId = STORIES[idx+1].id; renderTeacherBoard(true); } };

  replyList.querySelectorAll('[data-del]').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await deleteDoc(getPublicDoc('comments', btn.getAttribute('data-del')));
      } catch(e) {
        console.error(e);
        btn.disabled = false;
      }
    };
  });

  return wrap;
}

function escapeHtml(str){
  return String(str == null ? '' : str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// Initial Render Trigger
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음주 위험 실험실</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef3f8;font-family:"Noto Sans KR",Arial,sans-serif;color:#172033}
.container{max-width:1000px;margin:0 auto;padding:24px}
.card{background:#fff;border-radius:26px;padding:32px;box-shadow:0 10px 35px rgba(0,0,0,.08)}
h1{font-size:40px;margin:0 0 8px}
h2{font-size:30px;margin:0 0 18px}
.subtitle{font-size:19px;color:#667085;line-height:1.5}
.progress{display:flex;gap:8px;margin:22px 0}
.progress div{height:9px;flex:1;border-radius:10px;background:#dfe5ec}
.progress .active{background:#5269df}
.notice{padding:18px;border-radius:17px;background:#f5f7fb;font-size:18px;line-height:1.6;margin:18px 0}
.members{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:22px 0}
.member-btn{min-height:85px;border:3px solid #dce2eb;border-radius:18px;background:#fff;font-size:24px;font-weight:800;cursor:pointer}
.member-btn.selected{border-color:#5269df;background:#eef1ff}
.primary{width:100%;border:0;border-radius:18px;background:#5269df;color:#fff;padding:19px;font-size:22px;font-weight:800;cursor:pointer;margin-top:12px}
.secondary{width:100%;border:0;border-radius:18px;background:#edf1f7;color:#263143;padding:17px;font-size:20px;font-weight:800;cursor:pointer;margin-top:12px}
.rolebox{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}
.role{padding:20px;border-radius:18px;background:#f7f8fa;font-size:19px;line-height:1.55}
.role b{font-size:23px}
.experimenter{border:3px solid #5269df; background:#f0f4ff;}
.observer{border:3px solid #32b866; background:#f0fdf4;}

/* 색깔 반응검사 버튼 컴팩트화 (정밀 타격 유도) */
.reaction-area{display:flex;justify-content:center;gap:18px;margin:20px 0}
.reaction{width:170px;min-height:65px;border:0;border-radius:16px;font-size:21px;font-weight:900;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.green{background:#32b866;color:white}
.red{background:#e65757;color:white}

.arrow-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.arrow{font-size:40px;padding:22px}
.scene{font-size:25px;line-height:1.6;margin:22px 0}
.small{font-size:16px;color:#687386}
.result{padding:20px;border-radius:18px;background:#f5f5fb;font-size:19px;line-height:1.65;margin-top:18px}
.color-stimulus{width:150px;height:90px;margin:18px auto;border-radius:16px;box-shadow:0 4px 10px rgba(0,0,0,.12)}
.stim-green{background:#20a85a}
.stim-red{background:#e5484d}
.reaction-status{text-align:center;font-size:22px;font-weight:800;min-height:32px}
.score-card{max-width:560px;margin:20px auto;padding:18px 22px;background:#f7f8fa;border:2px solid #d5d8dd;border-radius:18px}
.score-row{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;font-size:20px;border-bottom:1px solid #ddd}
.score-total{display:flex;justify-content:space-between;align-items:center;padding:16px 4px 4px;font-size:24px}
.score-total strong{font-size:30px}
.course-list{max-width:700px;margin:18px auto;display:grid;gap:12px}
.course-item{padding:16px 18px;background:#f7f8fa;border:2px solid #d5d8dd;border-radius:15px;font-size:19px}
@media(max-width:700px){
 .members{grid-template-columns:1fr}
 .rolebox{grid-template-columns:1fr}
 .reaction-area{flex-direction:row}
 .reaction{width:140px;min-height:60px;font-size:19px}
 h1{font-size:32px}
}
</style>
</head>
<body>
<div class="container">
<div class="card">
<div class="small">6학년 음주 예방 · 모둠 태블릿 활동</div>
<h1>🔬 음주 위험 실험실</h1>
<div class="subtitle">모둠원 수를 선택하면 선택한 인원수만큼 모든 실험이 자동으로 진행됩니다.</div>
<div class="progress" id="progress"></div>
<div id="app"></div>
</div>
</div>

<script>
const STEP_NAMES=["모둠 구성","평상시 반응 실험","고글 체험","체험 후 반응 실험","정리"];
let memberCount=0;
let current=1;
let scores={};
let postScores={};

const app=document.getElementById("app");
const progress=document.getElementById("progress");

function setProgress(step){
    progress.innerHTML=STEP_NAMES.map((x,i)=>
        `<div class="${i<=step?"active":""}" title="${x}"></div>`).join("");
}

function button(text,action,cls=""){
    return `<button class="${cls}" onclick="${action}">${text}</button>`;
}

function render(content,step=0){
    setProgress(step);
    app.innerHTML=content;
}

/* ===== 첫 페이지: 모둠원 선택 ===== */
function firstPage(){
    render(`
        <div class="scene">
            <b>👥 우리 모둠은 몇 명인가요?</b><br>
            <span class="subtitle">먼저 모둠의 인원수를 선택하세요.</span>
        </div>

        <div class="notice">
            <b>📌 모둠원 수 선택 안내</b><br>
            선택한 인원수에 맞춰 <b>1번부터 차례대로</b> 모든 실험 및 체험이 순서대로 진행됩니다.
        </div>

        <div class="members">
            ${[4,5,6].map(n=>`
                <button id="m${n}" class="member-btn" onclick="chooseMembers(${n})">
                    ${n}명
                </button>`).join("")}
        </div>

        <div id="selectedText" class="result">
            아직 모둠 인원을 선택하지 않았습니다.
        </div>

        <button id="startBtn" class="primary" disabled
            style="opacity:.45;cursor:not-allowed"
            onclick="startGame()">
            ▶ 모둠 실험 시작하기
        </button>
    `,0);
}

function chooseMembers(n){
    memberCount=n;
    [4,5,6].forEach(x=>{
        const el=document.getElementById("m"+x);
        if(el) el.classList.toggle("selected",x===n);
    });
    const text=document.getElementById("selectedText");
    text.innerHTML=`<b>현재 선택:</b> ${n}명 모둠<br>
    <span class="small">반응 실험 ${n}명 → 고글 체험 ${n}명 → 다시 반응 실험 ${n}명</span>`;
    const start=document.getElementById("startBtn");
    start.disabled=false;
    start.style.opacity="1";
    start.style.cursor="pointer";
}

function startGame(){
    if(!memberCount){
        alert("먼저 모둠 인원수를 선택하세요.");
        return;
    }
    current=1;
    scores={};
    postScores={};
    showBaselineIntro();
}

/* ===== 1단계: 평상시 반응 실험 ===== */
function showBaselineIntro(){
    render(`
        <div class="scene">
            <b>1단계 · 평상시 반응 실험</b><br>
            지금은 <b>👤 ${current}번 실험자</b>의 차례입니다.
        </div>

        <div class="notice">
            <b>📌 모둠 진행 순서</b><br>
            ${Array.from({length:memberCount},(_,i)=>`${i+1}번 실험자`).join(" → ")}<br><br>
            현재는 <b>${current}번 실험자</b>가 실험합니다.
            다른 학생은 옆에서 기다리며 순서를 확인합니다.
        </div>

        <div class="rolebox">
            <div class="role experimenter">
                <b>👤 ${current}번 실험자</b><br>
                지금 반응 판단 실험을 합니다.
            </div>
            <div class="role observer">
                <b>👀 나머지 모둠원</b><br>
                실험 순서를 확인하고 자기 차례를 기다립니다.
            </div>
        </div>

        ${button(`▶ ${current}번 실험자 반응 실험 시작`,`reactionTest(1,${current})`,"primary")}
    `,1);
}

/* ===== 색깔 반응 검사 (제한시간 1.2초 / 축소된 정밀 버튼) ===== */
function reactionTest(round,member){
    let q=0, correct=0, locked=false, timer=null;

    function finish(){
        if(q>=10){
            if(round===1){
                if(!scores[member]) scores[member]={};
                scores[member].reaction=correct;
                directionTest(1,member);
            }else{
                postScores[member]=postScores[member]||{};
                postScores[member].reaction=correct;
                directionTest(2,member);
            }
            return;
        }

        locked=false;
        if(timer) clearTimeout(timer);

        const targetIsGreen = Math.random() > .5;
        const buttonsOrder = Math.random() > .5 ? ["green", "red"] : ["red", "green"];

        render(`
            <div class="small">👤 ${member}번 실험자 · 색깔 판단 ${q+1}/10</div>

            <div class="scene">
                <b>제시된 색깔과 같은 버튼을 빠르게 누르세요!</b><br>
                <span class="small" style="color:#e65757;font-weight:bold;">⚠️ 버튼 위치가 계속 바뀌니 정확하게 터치하세요!</span>
            </div>

            <div id="colorStimulus" class="color-stimulus ${targetIsGreen ? "stim-green" : "stim-red"}"></div>

            <div class="reaction-area">
                ${buttonsOrder.map(type => type === "green" 
                    ? `<button id="btnGreen" class="reaction green" onclick="pickColor('green', ${targetIsGreen})">🟢 초록</button>`
                    : `<button id="btnRed" class="reaction red" onclick="pickColor('red', ${targetIsGreen})">🔴 빨강</button>`
                ).join('')}
            </div>

            <div id="reactionStatus" class="reaction-status">⚡ 1.2초 안에 판단하세요!</div>
        `,1);

        const btnG = document.getElementById("btnGreen");
        const btnR = document.getElementById("btnRed");
        const status = document.getElementById("reactionStatus");

        function lockBtns(){
            if(btnG) btnG.disabled = true;
            if(btnR) btnR.disabled = true;
        }

        window.pickColor = function(userChoice, isGreenTarget){
            if(locked) return;
            locked = true;
            if(timer) clearTimeout(timer);

            const isCorrect = (userChoice === "green" && isGreenTarget) || (userChoice === "red" && !isGreenTarget);
            if(isCorrect) correct++;

            status.innerHTML = isCorrect ? "✅ 정답!" : "❌ 오답! 다음 문제로 넘어갑니다.";
            lockBtns();

            setTimeout(()=>{
                q++;
                finish();
            }, 350);
        };

        timer = setTimeout(()=>{
            if(locked) return;
            locked = true;
            status.innerHTML = "⏱️ 시간 초과! 다음 문제로 넘어갑니다.";
            lockBtns();
            setTimeout(()=>{
                q++;
                finish();
            }, 350);
        }, 1200);
    }

    finish();
}

/* ===== 방향 판단 검사 (제한시간 1.7초 / 버튼 위치 무작위) ===== */
function directionTest(round,member){
    let q=0, correct=0, locked=false, timer=null;
    const baseDirs = ["⬆️", "⬇️", "⬅️", "➡️"];

    function next(){
        if(q>=10){
            if(round===1){
                scores[member].direction=correct;
                showStep1Score(member);
            }else{
                postScores[member]=postScores[member]||{};
                postScores[member].direction=correct;
                postNext(member);
            }
            return;
        }

        locked=false;
        if(timer) clearTimeout(timer);

        const targetDir = baseDirs[Math.floor(Math.random()*baseDirs.length)];
        const shuffledDirs = [...baseDirs].sort(() => Math.random() - 0.5);

        render(`
            <div class="small">👤 ${member}번 실험자 · 방향 판단 ${q+1}/10</div>
            <div class="scene" style="text-align:center;font-size:78px">${targetDir}</div>
            <div class="notice" style="text-align:center;">
                <b>1.7초 안에 똑같은 방향 버튼을 찾아서 누르세요!</b><br>
                <span class="small" style="color:#e65757;font-weight:bold;">⚠️ 버튼의 위치가 매번 달라집니다!</span>
            </div>
            <div class="arrow-grid">
                ${shuffledDirs.map((x,i)=>`<button id="dirBtn${i}" class="secondary arrow" onclick="pickDir('${x}','${targetDir}')">${x}</button>`).join("")}
            </div>
            <div id="directionStatus" class="reaction-status">⏱️ 1.7초 안에 판단하세요!</div>
        `,1);

        const buttons = shuffledDirs.map((_,i)=>document.getElementById("dirBtn"+i));
        const status = document.getElementById("directionStatus");

        function lockButtons(){
            buttons.forEach(b=>{ if(b){ b.disabled=true; b.style.opacity=".55"; } });
        }

        window.pickDir = function(x, dest){
            if(locked) return;
            locked=true;
            if(timer) clearTimeout(timer);

            if(x===dest){
                correct++;
                status.innerHTML="✅ 정답!";
            }else{
                status.innerHTML="❌ 오답! 다음 문제로 넘어갑니다.";
            }
            lockButtons();

            setTimeout(()=>{
                q++;
                next();
            }, 350);
        };

        timer=setTimeout(()=>{
            if(locked) return;
            locked=true;
            status.innerHTML="⏱️ 시간 초과! 다음 문제로 넘어갑니다.";
            lockButtons();
            setTimeout(()=>{
                q++;
                next();
            }, 350);
        }, 1700);
    }
    next();
}

function showStep1Score(member){
    const reactionScore = (scores[member] && scores[member].reaction) || 0;
    const directionScore = (scores[member] && scores[member].direction) || 0;
    const total = reactionScore + directionScore;

    render(`
        <div class="small">👤 ${member}번 실험자 · 1단계 실험 완료</div>
        <div class="scene">
            <h2>🎉 1단계 실험 결과</h2>
            <p>색깔 반응 판단과 방향 판단 실험을 모두 마쳤습니다.</p>
        </div>

        <div class="score-card">
            <div class="score-row">
                <span>색깔 반응 판단</span>
                <b>${reactionScore} / 10점</b>
            </div>
            <div class="score-row">
                <span>방향 판단</span>
                <b>${directionScore} / 10점</b>
            </div>
            <div class="score-total">
                <span>1단계 총점</span>
                <strong>${total} / 20점</strong>
            </div>
        </div>

        <div class="notice">
            📝 <b>본인의 점수를 확인하고 활동지에 적으세요.</b><br>
            활동지의 1단계 실험 결과에 점수를 기록한 후 다음 단계로 넘어갑니다.
        </div>

        <button class="primary" onclick="baselineNext(${member})">점수 기록 완료 → 다음 단계</button>
    `,1);
}

function baselineNext(member){
    if(member<memberCount){
        current=member+1;
        render(`
            <div class="scene"><b>✅ ${member}번 실험 완료!</b></div>
            <div class="result">
                이제 <b>👤 ${current}번 실험자</b>의 차례입니다.<br>
                ${memberCount}명 모둠이므로 ${current}번까지 모두 실험한 뒤 고글 체험으로 넘어갑니다.
            </div>
            ${button(`▶ ${current}번 실험자 시작`,`showBaselineIntro()`,"primary")}
        `,1);
    }else{
        current=1;
        pauseAfterStep1();
    }
}

/* ===== 2단계: 고글 체험 ===== */
function gogglesIntro(member){
    const observer = member === memberCount ? 1 : member + 1;

    render(`
        <div class="small">🥽 2단계 · 고글 체험</div>

        <div class="rolebox">
            <div class="role experimenter">
                <b>🥽 실험자: ${member}번</b><br>
                안경(고글)을 끼고 아래 3코스를 체험합니다.
            </div>
            <div class="role observer">
                <b>👀 관찰자: ${observer}번</b><br>
                실험자의 활동지에 체크리스트를 작성하세요.
            </div>
        </div>

        <div class="course-list">
            <div class="course-item"><b>① 선을 따라 걸으세요.</b></div>
            <div class="course-item"><b>② 멈춤선 바로 앞에서 멈추세요.</b></div>
            <div class="course-item"><b>③ 고깔을 돌아서 다시 원래 자리로 돌아오세요.</b></div>
        </div>

        <button class="primary" onclick="goggleCourseDone(${member})">${member}번 실험자 실험완료</button>
    `,2);
}

function goggleCourseDone(member){
    pauseAfterStep2(member);
}

/* ===== 3단계: 체험 후 반응 실험 ===== */
function postIntro(){
    render(`
        <div class="scene"><b>3단계 · 🔁 체험 후 다시 검사</b><br>
        이제 모든 학생의 고글 체험이 끝났습니다.</div>
        <div class="notice">
            🥽 <b>지금부터는 고글을 착용한 상태로</b> 반응 실험과 방향 판단 실험을 다시 진행합니다.<br>
            다시 <b>1번 → 2번 → 3번 → 4번${memberCount>=5?" → 5번":""}${memberCount>=6?" → 6번":""}</b>
            순서로 검사합니다.
        </div>
        <div class="rolebox">
            <div class="role experimenter"><b>🥽 ${current}번 실험자</b><br>고글을 착용한 채 반응 판단부터 다시 시작합니다.</div>
            <div class="role observer"><b>👀 나머지 모둠원</b><br>자기 점수를 활동지에 기록할 준비를 합니다.</div>
        </div>
        ${button(`▶ ${current}번 실험자 · 고글 착용 후 반응 실험`,`reactionTest(2,${current})`,"primary")}
    `,3);
}

function postNext(member){
    if(member<memberCount){
        current=member+1;
        render(`
            <div class="scene"><b>✅ ${member}번 실험 완료!</b><br>
            이제 <b>👤 ${current}번 실험자</b>의 차례입니다.</div>
            <div class="notice">🥽 다음 실험자도 고글을 착용한 상태로 진행합니다.</div>
            ${button(`▶ ${current}번 실험자 · 고글 착용 후 검사`,`postIntro()`,"primary")}
        `,3);
    }else{
        pauseAfterStep3();
    }
}

function compare(){
    render(`
        <div class="scene"><b>📊 모둠 결과 비교</b></div>
        <div class="result">
        ${Array.from({length:memberCount},(_,i)=>{
            const m=i+1,s=scores[m],p=postScores[m];
            return `<b>👤 ${m}번</b> · 반응 ${s.reaction}/10 →${p.reaction}/10 · 방향 ${s.direction}/10 →${p.direction}/10`;
        }).join("<br>")}
        </div>
        <div class="notice">개인 활동지에 자신의 체험 전·후 점수를 비교해서 기록하세요.</div>
        ${button("🧠 오늘 학습 정리하기","finish()","primary")}
    `,3);
}

/* ===== 4단계: 마무리 정리 ===== */
function finish(){
    render(`
        <div class="scene"><b>🧠 오늘 학습 정리하기</b></div>
        <div class="notice">
            <b>오늘 고글 체험 및 반응 검사를 통해 느낀 점을 생각해보세요.</b><br>
            음주가 우리의 판단력, 균형감각, 반응 속도에 어떤 영향을 주는지 활동지에 정리해봅시다.
        </div>
        ${button("🎉 탐구 완료","done()","primary")}
    `,4);
}

function done(){
    render(`
        <div class="scene">🎉 <b>음주 위험 실험실 탐구 완료!</b></div>
        <div class="result">
        <b>오늘의 핵심 정리</b><br>
        음주는 신체 균형, 거리감, 판단력 및 반응 속도에 직·간접적인 영향을 주며, 
        그 결과 위험한 선택이나 예상치 못한 사고 위험이 높아집니다.<br><br>
        <b>개인 활동지에 자신의 점수와 느낀 점을 최종 작성하여 마무리하세요.</b>
        </div>
    `,4);
}

function pausePage(step, title, message, nextAction, buttonText){
    render(`
        <div class="scene"><b>⏸️ ${title}</b></div>
        <div class="notice" style="text-align:center;padding:35px 20px;">
            ${message}<br><br>
            <b>선생님의 설명을 들은 뒤 버튼을 눌러 다음 단계로 이동하세요.</b>
        </div>
        ${button(`▶ ${buttonText}`, nextAction, "primary")}
    `,step);
}

function pauseAfterStep1(){
    pausePage(1,"잠깐! 1단계가 끝났습니다.","평상시 반응 실험을 마쳤습니다.","gogglesIntro(1)","2단계 고글 체험 시작하기");
}

function pauseAfterStep2(member){
    if(member<memberCount){
        current=member+1;
        gogglesIntro(current);
    }else{
        pausePage(2,"잠깐! 2단계가 끝났습니다.","모든 학생의 고글 체험이 끝났습니다.","postIntro()","3단계 시작하기");
    }
}

function pauseAfterStep3(){
    pausePage(3,"잠깐! 3단계가 끝났습니다.","고글을 착용한 상태의 반응 실험을 모두 마쳤습니다.","compare()","결과 비교하기");
}

/* 첫 페이지 실행 */
firstPage();
</script>
</body>

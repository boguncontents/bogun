<div class="phone-shell" aria-label="스마트폰 채팅 화면"><img class="phone-art" src="assets/phone.png" alt=""/>
<div class="phone-ui"><header class="chat-header"><div class="headtitle"><img class="profile-avatar" id="singleAvatar" src="assets/game_friend.png" alt="게임 친구 프로필"><span id="roomLabel"></span><span id="groupMembers" class="group-members" aria-label="단톡방 참여자" hidden><img src="assets/minjun.png" alt="민준"><img src="assets/hyunwoo.png" alt="현우"><img src="assets/seoyeon.png" alt="서연"></span></div><div id="stage"></div></header>
<main id="log" aria-live="polite"></main><footer id="controls"><div id="entry"></div></footer></div></div>
<aside class="help-panel"><div class="panel-kicker">DIGITAL SAFETY · 미션 안내</div><h2>어떻게 답할까요?</h2><div class="tip" id="hint">상황을 잘 읽고 답해 보세요.</div><section class="feedback-box" aria-live="polite"><div class="feedback-head">💡 생각해 볼까요?</div><div class="error" id="error"></div><div class="feedback-empty">답변에 대한 설명은 필요할 때 여기에 표시돼요.</div></section><div class="help-note">안전한 표현을 직접 입력해 보세요. 도움이 필요할 때는 믿을 수 있는 어른에게 이야기할 수 있어요.</div></aside>
</div><div id="debug"></div>
<script>
// Configure the visible room header BEFORE asynchronous code loading and before first paint.
// The parent still starts actual dialogue with DS_AI_START; this is display-only.
(function prepareRoomHeader(){
  const isGroup=new URLSearchParams(location.search).get('mission')==='2';
  document.getElementById('roomLabel').textContent=isGroup?'우리 반 단톡방':'게임 친구';
  document.body.classList.toggle('mission-two',isGroup);
  const avatar=document.getElementById('singleAvatar');
  if(avatar) avatar.hidden=isGroup;
  const members=document.getElementById('groupMembers');
  if(members) members.hidden=!isGroup;
})();
// 독립 코드 세 파일은 완전히 읽힌 다음에만 게임 입력을 시작합니다.
// 주소의 ?v=301 등을 변경하면 판정 파일만 교체한 경우에도 새 코드를 불러옵니다.
function DSLoadScript(url){return new Promise((resolve,reject)=>{
  const el=document.createElement('script');el.src=url;el.onload=resolve;
  el.onerror=()=>reject(new Error(url+' 불러오기 실패'));
  document.head.appendChild(el);
});}
async function DSLoadGame(){
  const qs=new URLSearchParams(location.search);
  const revision=encodeURIComponent(qs.get('v')||'08');
  try {
    await DSLoadScript('./judge.js?v='+revision);
    await DSLoadScript('./ai.js?v='+revision);
    window.DSBoot();
  }catch(error){
    const hint=document.getElementById('hint');
    const box=document.getElementById('error');
    hint.textContent='필수 판정 파일을 불러오지 못했어요.';
    box.textContent='GitHub에 judge.js와 ai.js가 같은 폴더에 있는지 확인해 주세요.';
    document.getElementById('debug').textContent='clean-modular-v0.3 · '+error.message;
    document.getElementById('debug').style.display='block';
  }
}
</script>
<script>
window.DSBoot=function(){
(()=>{'use strict';
const BUILD='clean-modular-v0.3';
const doc=(id)=>document.getElementById(id);
const el={log:doc('log'),stage:doc('stage'),hint:doc('hint'),error:doc('error'),entry:doc('entry'),debug:doc('debug')};
let parentDebug=false;try{parentDebug=new URLSearchParams(window.parent.location.search).get('debug')==='1';}catch(_){} const DEBUG=new URLSearchParams(location.search).get('debug')==='1'||parentDebug;
const npcNames={m1:'게임 친구',m2:'민준'};
const scenes={
 m1:[
  {id:'m1_age',pre:[['게임 친구','왔어? ㅋㅋ 오늘은 왜 이렇게 늦게 왔어~'],['주인공','ㅋㅋ 지금 쉬는 시간이야! 잠깐 들어왔어.'],['게임 친구','어제 게임 진짜 재밌었지? ㅋㅋ 이 형님이 이겼잖아~'],['게임 친구','근데 우리 동생은 나이가 어떻게 되시나~? ㅋㅋ']],prompt:'나이 질문에 어떻게 답할까?'},
  {id:'m1_school',pre:[['게임 친구','아ㅋㅋ 그냥 궁금해서. 그럼 너 어느 학교 다녀?']],prompt:'학교 질문에 어떻게 답할까?'},
  {id:'m1_photo',pre:[['게임 친구','앗ㅋㅋ 내가 너무 꼬치꼬치 캐물었나? 쏘리쏘리~'],['게임 친구','아 근데 다른 건 몰라도 네가 어떻게 생겼는지는 진짜 궁금하다ㅋㅋ'],['게임 친구','사진 한 장만 보내주면 안 돼?']],prompt:'사진 요구에 어떻게 답할까?'},
  {id:'m1_pressure',pre:[['게임 친구','에이 한 장만ㅋㅋ 나만 볼게. 다른 사람한테 절대 안 보여줄게.']],prompt:'반복되는 사진 요구에 어떻게 답할까?'},
  {id:'m1_secret',pre:[['게임 친구','우리 그냥 특별한 친구 하자ㅋㅋ 대신 우리가 이야기한 건 다른 사람한테 말하지 마. 우리 둘만의 비밀!']],prompt:'비밀 요구에 어떻게 답할까?'}
 ],
 m2:[
  {id:'m2_reject',pre:[['시스템','우리 반 단체 채팅방'],['서연','내일 체육 준비물 뭐였지?'],['현우','줄넘기 아니야?'],['민준','야 근데 이것 좀 봐ㅋㅋ'],['시스템','민준님이 사진을 보냈습니다.'],['민준','어제 체육시간에 지우 몰래 찍은 사진이야ㅋㅋ 이거 저장해!']],prompt:'사진 저장 요구에 어떻게 답할까?'},
  {id:'m2_pressure',pre:[['민준','갑자기 왜 그래ㅋㅋ'],['서연','야 왜 분위기 깨고 그래. 너만 왜 그래?'],['민준','그냥 하라면 좀 해.']],prompt:'친구들의 압박에 어떻게 답할까?'},
  {id:'m2_help',pre:[['민준','그럼 너도 우리 대화 캡처하지 마. 선생님한테 말하면 진짜 재미없다.']],prompt:'대화 캡처 금지와 도움 요청 금지 압박에 어떻게 답할까?'}
 ]
};
const fallbackChoices={
 m1_age:['나이는 알려주지 않을 거야.','왜 나이를 물어봐?','이런 질문은 그만해 줘.'],
 m1_school:['학교는 말하지 않을래.','왜 학교를 알려줘야 해?','개인정보를 물어보지 마.'],
 m1_photo:['사진은 보내지 않을 거야.','그런 요구는 불편해.','계속 그러면 차단할 거야.'],
 m1_pressure:['계속 요구해도 안 보낼 거야.','이제 대화를 끝낼게.','선생님께 도움을 요청할 거야.'],
 m1_secret:['비밀로 하지 않을 거야.','선생님께 말씀드릴 거야.','이런 요구는 수상해.'],
 m2_reject:['허락 없이 찍힌 사진은 저장하지 않을래.','이런 행동은 잘못이야.','지우에게 알려야겠어.'],
 m2_pressure:['싫어. 그런 사진은 저장하지 않아.','친구들이 시켜도 안 할 거야.','그만하자. 이건 잘못된 일이야.'],
 m2_help:['대화 기록을 남기고 어른에게 알릴게.','이런 일은 선생님께 말씀드려야 해.','캡처해서 증거를 남길 거야.']
};
let revealRun=0, revealTimer=null;
let mission=null,step=0,busy=false,stats={local:0,api:0,fallback:0},lastDiag={stage:'-',route:'ready',status:0,attempts:0,elapsedMs:0,error:''};
function postDiagnostic(stage,route,ms,status,attempts,error){const data={type:'DS_AI_DIAG',stage,route,elapsedMs:ms,status,attempts,error:error||''};lastDiag=data;if(route==='local')stats.local++;if(route==='api')stats.api++;if(route==='fallback')stats.fallback++;if(DEBUG){el.debug.style.display='block';el.debug.textContent=BUILD+'\n단계 '+stage+' | '+route+'\nHTTP '+(status||'-')+' / '+Math.round(ms)+'ms / 시도 '+attempts+'회\n사유 '+(error||'없음')+'\n기기 '+stats.local+' · API '+stats.api+' · 대체 '+stats.fallback;}window.parent.postMessage(data,'*');}
function bubble(name,message){const d=document.createElement('div');d.className='bubble '+(name==='주인공'?'me':name==='시스템'?'system':'them');const cap=document.createElement('div');cap.className='name';cap.textContent=name;d.appendChild(cap);d.appendChild(document.createTextNode(message));d.classList.add('message-coming');if(mission==='m2'&&['민준','현우','서연'].includes(name)){const av=document.createElement('img');av.className='speaker-avatar';av.src='assets/'+({민준:'minjun',현우:'hyunwoo',서연:'seoyeon'}[name])+'.png';av.alt='';d.prepend(av);d.classList.add('group-bubble');}el.log.appendChild(d);el.log.scrollTop=el.log.scrollHeight;}
function notice(message){const n=document.createElement('div');n.className='bubble alert';n.textContent=message;el.log.appendChild(n);el.log.scrollTop=el.log.scrollHeight;}
function clearEntry(){el.entry.innerHTML='';el.error.textContent='';}
function makeButtons(buttons){clearEntry();const c=document.createElement('div');c.className='choices';buttons.forEach(([text,fn])=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=text;b.onclick=fn;c.appendChild(b);});el.entry.appendChild(c);}
function validate(raw){const text=String(raw||'').trim();if(!text)return '답변을 입력해 주세요.';if(text.length>90)return '90자 이내로 답해 주세요.';if(/(?:01[016789][- .]?\d{3,4}[- .]?\d{4}|[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}|https?:\/\/)/i.test(text))return '개인정보나 링크는 입력하지 마세요.';return '';}
async function decide(stage,text){
  const local=window.DSJudge.classify(stage,text);
  if(local.status==='safe'||local.status==='unsafe'){
    postDiagnostic(stage,'local',0,0,0,local.status);
    return local;
  }
  // UNCLEAR alone reaches Gemini; no second SAFE screen exists.
  const currentScene=scenes[mission][step];
  return window.DSAI.evaluate(stage,text,currentScene.pre.at(-1)[1],
    (route,ms,status,attempts,reason)=>postDiagnostic(stage,route,ms,status,attempts,reason));
}
function fallback(stage){notice('AI 연결이 잠시 원활하지 않아요. 안전한 대응을 선택해 계속할 수 있어요.');el.hint.textContent='아래 보기 중 한 가지를 골라 다음 대화로 진행해요.';makeButtons(fallbackChoices[stage].map(v=>[v,()=>{bubble('주인공',v);postFallbackContinue();}]));}
function postFallbackContinue(){nextStage();}
function compose(){const c=scenes[mission][step];doc('roomLabel').textContent=mission==='m1'?'게임 친구':'우리 반 단톡방';el.stage.textContent='MISSION '+(mission==='m1'?'1':'2')+' · '+(step+1)+' / '+scenes[mission].length;el.hint.textContent='✏️ '+c.prompt;clearEntry();const row=document.createElement('div');row.className='compose';const input=document.createElement('textarea');input.rows=2;input.maxLength=90;input.placeholder='내 생각을 직접 입력해 보세요';const button=document.createElement('button');button.type='button';button.textContent='전송';row.append(input,button);el.entry.appendChild(row);requestAnimationFrame(()=>{el.log.scrollTop=el.log.scrollHeight;});requestAnimationFrame(()=>{try{input.focus({preventScroll:true});}catch(_){input.focus();}});button.onclick=async()=>{if(busy)return;const text=input.value.trim();const problem=validate(text);if(problem){el.error.textContent=problem;return;}busy=true;row.classList.add('busy');el.error.textContent='답변을 확인하는 중…';const verdict=await decide(c.id,text);busy=false;row.classList.remove('busy');el.error.textContent='';if(verdict.status==='safe'){bubble('주인공',text);nextStage();}else if(verdict.status==='unsafe'){el.error.textContent=verdict.reason||'안전한 말로 다시 써 보세요.';input.focus();}else if(verdict.status==='fallback'){bubble('주인공',text);fallback(c.id);}else{el.error.textContent=verdict.reason||'자신의 생각을 조금 더 분명하게 써 보세요.';input.focus();}};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();button.click();}};}
function nextStage(){step++;if(step<scenes[mission].length){showStage();return;} if(mission==='m1'){bubble('시스템','온라인 친구의 부적절한 요구가 이어졌습니다.');makeButtons([['📸 대화 캡처하기',()=>{bubble('주인공','📸 대화 기록을 남겼어요.');bubble('게임 친구','어, 오늘 내가 좀 많이 물어봤나? ㅎㅎ 그래도 우리 친구지? 이따 게임에서 만나!');makeButtons([['🚫 상대방 차단하기',()=>{bubble('주인공','🚫 상대방을 차단했어요.');finish();}]]);}]]);}else{bubble('민준','야, 진짜 짜증 나네! 너 혼자 잘난 척하지 마!');makeButtons([['📸 대화 캡처하기',()=>{bubble('주인공','📸 대화 기록을 남겼어요.');finish();}]]);}}
function finish(){el.hint.textContent='이 활동을 완료했어요.';makeButtons([['다음 장면으로 이동',()=>{window.parent.postMessage({type:'DS_AI_FINISH',mission:mission==='m1'?1:2},'*');}]]);}
function showStage(){
 const c=scenes[mission][step]; const token=++revealRun;
 el.entry.innerHTML='';el.error.textContent='';el.hint.textContent='💬 대화 내용을 읽어 보세요.';
 el.stage.textContent='MISSION '+(mission==='m1'?'1':'2')+' · '+(step+1)+' / '+scenes[mission].length;
 let pos=0;
 function displayNext(){
   if(token!==revealRun)return;
   if(pos<c.pre.length){const [name,msg]=c.pre[pos++];bubble(name,msg);if(pos<c.pre.length){revealTimer=setTimeout(displayNext,1050);}else{revealTimer=setTimeout(()=>{if(token===revealRun)compose();},650);} }
 }
 displayNext();
 // Students may tap the chat area to advance a message without waiting.
 el.log.onclick=()=>{if(token!==revealRun||pos>=c.pre.length)return;clearTimeout(revealTimer);displayNext();};
}
function start(m){document.getElementById('roomLabel').textContent=m===2?'우리 반 단톡방':'게임 친구';document.body.classList.toggle('mission-two',m===2);const headAvatar=document.querySelector('.profile-avatar');if(headAvatar)headAvatar.hidden=m===2;const gm=document.getElementById('groupMembers');if(gm)gm.hidden=m!==2;clearTimeout(revealTimer);revealRun++;mission=m===1?'m1':'m2';step=0;busy=false;el.log.innerHTML='';el.entry.innerHTML='';el.error.textContent='';el.stage.textContent='';showStage();}
window.addEventListener('resize',()=>{requestAnimationFrame(()=>{el.log.scrollTop=el.log.scrollHeight;});});
window.addEventListener('message',event=>{if(event.source!==window.parent||!event.data||event.data.type!=='DS_AI_START')return;start(Number(event.data.mission));});
// Expose a read-only test entry through debug mode; no extra API calls.
if(DEBUG){window.__DS_TEST__={classify:window.DSJudge.classify,apiMap:window.DSAI.sceneMap,scenes,build:BUILD};el.debug.style.display='block';el.debug.textContent=BUILD+'\n테스트 대기중';}
// Wait silently for the parent to start the selected mission.
window.parent.postMessage({type:'DS_CHAT_READY',build:BUILD},'*');
})();
};
DSLoadGame();
</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>7개의 단서! 감염병을 조사하라!</title><style>

orm:translateY(3px);box-shadow:0 3px 0 #9c5c10}.guide{position:absolute;left:15%;top:80.5%;width:70%;text-align:center;color:#183451;font-size:clamp(10px,1.65vw,23px);font-weight:900;text-shadow:0 2px 4px #fff}.small{position:absolute;top:96%;left:0;width:100%;text-align:center;color:#293d50;font-size:clamp(8px,.95vw,13px);font-weight:700}.stage img{user-select:none;-webkit-user-drag:none}

</style></head><body><main class="stage" aria-label="감염병 역학조사 첫 화면"><div class="back"></div><div class="wash"></div><img class="logo" src="../assets/intro/title.webp" alt="7개의 단서! 감염병을 조사하라!"><div class="guide">교실 곳곳에 숨겨진 QR 단서를 찾아 감염 위험 경로를 추리하자!</div><div class="cast-row"><div class="cast"><div class="portrait"><img src="../assets/intro/minjun.webp" alt="민준"></div><div class="name">민준</div></div>

 <img src="../assets/brand-logo-small.png" alt="보건플레이랩 by JH Studio">
 <button type="button" class="jh-info" id="jhCopyrightInfo">ⓘ 저작권 안내</button>
</div></main><div class="jh-overlay" id="jhCopyrightOverlay" aria-hidden="true">
 <section class="jh-dialog" role="dialog" aria-modal="true" aria-labelledby="jhCopyrightHeading" tabindex="-1">
  <button type="button" class="jh-close" id="jhCopyrightClose" aria-label="저작권 안내 닫기">×</button>
  <img class="jh-dialog-logo" src="../assets/brand-logo-small.png" alt="보건플레이랩 by JH Studio">
  <h2 id="jhCopyrightHeading">콘텐츠 저작권 및 이용 안내</h2>
  <p>본 웹앱은 초등학교 보건교육을 목적으로<br>보건교사가 기획·제작한 체험형 교육 콘텐츠입니다.</p>
  <div class="jh-warning"><span class="jh-ban" aria-hidden="true">⊘</span><span>제작자의 사전 허락 없이 본 콘텐츠와 소스코드를 무단 복제·수정·재배포하거나 상업적으로 이용하는 것을 금지합니다.</span></div>

 </section>
</div><script>
document.getElementById('investigate').addEventListener('click',()=>{
  // In the integrated same-origin app, call the parent directly. Fall back to a message.
  if(window.parent!==window){
    try{if(typeof window.parent.openInvestigationStory==='function'){window.parent.openInvestigationStory();return;}}catch(_){}
    window.parent.postMessage({type:'intro-start-investigation'},'*');
    return;
  }
  // Opening intro/index.html by itself still proceeds to the main app's story page.
  window.location.href='../index.html?story=1';
});

// 브랜드 팝업만 제어; 기존 시작 버튼/수사 진행 로직은 그대로 유지.
(()=>{
 const trigger=document.getElementById('jhCopyrightInfo');
 const overlay=document.getElementById('jhCopyrightOverlay');
 const closeBtn=document.getElementById('jhCopyrightClose');
 const panel=overlay.querySelector('.jh-dialog');
 const open=()=>{overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');panel.focus()};
 const close=()=>{overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');trigger.focus()};
 trigger.addEventListener('click',open);
 closeBtn.addEventListener('click',close);
 overlay.addEventListener('click',e=>{if(e.target===overlay)close()});
 document.addEventListener('keydown',e=>{if(overlay.classList.contains('open')&&e.key==='Escape')close()});
})();
</script></body></html>

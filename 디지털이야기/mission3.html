<script>

/* Expression images must never block dialogue progression. */
function setGameExpression(element, character, mood='base') {
  if (!element) return;
  const fallback = `assets/${character}.png`;
  const available = { harin:['smile','worry','surprise'], mom:['worry','smile'], teacher:['listening','smile'], yuna:['worry','sad','relief'], doyun:['worry','surprise','sad','relief'] };
  let target = mood !== 'base' && (available[character] || []).includes(mood)
    ? `assets/expressions/${character}_${mood}.png` : fallback;
  try {
    // Use the existing expression helper when it has loaded correctly.
    if (window.DSExpressions && typeof window.DSExpressions.set === 'function') {
      window.DSExpressions.set(element, character, mood);
      target = element.getAttribute('src') || target;
    } else if (element.getAttribute('src') !== target) {
      element.setAttribute('src', target);
    }
  } catch (_error) {
    target = fallback;
    if (element.getAttribute('src') !== fallback) element.setAttribute('src', fallback);
  }
  element.onerror = () => {
    element.onerror = null;
    if (element.getAttribute('src') !== fallback) element.setAttribute('src', fallback);
  };
}

// The original text uses '서연' in the epilogue; the approved game design uses Harin.
const END=[['주인공 속마음','친구 이야기를 들어주고 함께 방법을 찾아봤어.'],['하린','친구랑 이야기는 잘했어?'],['주인공','응! 나도 모든 걸 아는 건 아니지만, 함께 방법을 찾아보면 좋겠어.'],['하린','맞아. 어려울 땐 도움도 요청하고!'],['주인공 속마음','앞으로도 친구가 어려움을 겪는다면 외면하지 않고 함께 방법을 찾아볼 거야.']];
const $=id=>document.getElementById(id),stage=$('sceneStage'),dialog=$('dialog'),sprite=$('character'),second=$('secondCharacter');
let phase='day',i=0,who=null,done={doyun:false,yuna:false},q=1,wrong=false,seq=[],seqEnd=null;
function clip(){
  for(const s of [sprite,second]){
    s.style.setProperty('--sprite-hide-bottom','0px');
    if(s.classList.contains('hidden'))continue;
    const r=s.getBoundingClientRect(),d=dialog.getBoundingClientRect();
    s.style.setProperty('--sprite-hide-bottom',Math.max(0,Math.min(s.offsetHeight,(r.bottom-(d.top+8))*(s.offsetHeight/Math.max(1,r.height)))).toFixed(1)+'px');
  }
}
function pictures(){
 const inClass=['day','opening','select','return','end'].includes(phase);
 stage.dataset.scene=inClass?'classroom':'hall';
 sprite.classList.remove('hidden','duo','left','right');second.classList.add('hidden');
 if(phase==='day'){
   sprite.classList.add('hidden');
 } else if(inClass && (phase!=='end'||i===0)){
   sprite.src='assets/doyun.png';sprite.dataset.character='doyun';sprite.alt='도윤';
   sprite.classList.add('duo','left');
   second.src='assets/yuna.png';second.classList.remove('hidden');
 } else if(phase==='end'){
   sprite.src='assets/harin.png';sprite.dataset.character='harin';sprite.alt='하린';
 } else {
   sprite.src=CASES[who].file;sprite.dataset.character=who;sprite.alt=CASES[who].label;
 }
 // Keep expressions stable across a conversation; change only at meaningful emotional turns.
 if(phase==='opening' || phase==='select' || phase==='return' || (phase==='end'&&i===0)){
   // Opening together: each friend looks worried only from the moment they reveal their concern.
   setGameExpression(sprite,'doyun',phase==='opening' && i>=4?'worry':'base');
   setGameExpression(second,'yuna',phase==='opening' && i>=5?'worry':'base');
 }else if(phase==='end'){
   setGameExpression(sprite,'harin',i===3?'smile':'base');
 }else if(phase!=='day' && who){
   let mood='worry';
   if(phase==='talk'){
     // One consistent worried expression throughout the disclosure.
     mood='worry';
   }else if(phase==='question'){
     mood='worry';
   }else if(phase==='feedback'){
     mood='sad';
   }else if(phase==='sequence'){
     if(wrong){
       mood='sad';
     }else if(q===1){
       // Relief after being understood, then concern as another message arrives.
       mood=i===1?'relief':i>=2?'worry':'worry';
     }else{
       // End in relief once the friend agrees to seek help together.
       // Switch on the friend's own fourth line, not the protagonist's third line.
       mood=i>=3?'relief':'worry';
     }
   }
   setGameExpression(sprite,who,mood);
 }
 requestAnimationFrame(clip);
}
function show(speaker,text){$('speaker').textContent=speaker;$('line').textContent=text;}
function standard(){dialog.classList.remove('has-options','is-feedback');$('feedback').textContent='';$('next').hidden=false;}
function render(){
 standard();pictures();
 if(phase==='day'){show('장면 전환','다음 날');$('next').textContent='다음 ▾';}
 else if(phase==='opening'){show(...OPEN[i]);$('next').textContent=i===OPEN.length-1?'친구 선택하기 ▾':'다음 ▾';}
 else if(phase==='select'){
  dialog.classList.add('has-options');show('주인공 속마음','누구 이야기를 먼저 들어볼까?');
  $('optionA').textContent='도윤 · AI 사진 합성'+(done.doyun?' ✓ 완료':'');
  $('optionB').textContent='유나 · 온라인 성희롱'+(done.yuna?' ✓ 완료':'');
  $('optionA').disabled=done.doyun;$('optionB').disabled=done.yuna;
 }
 else if(phase==='talk'){
  const c=CASES[who];show(...c.intro[i]);$('next').textContent=i===c.intro.length-1?'선택하기 ▾':'다음 ▾';
 }
 else if(phase==='question'){
  const c=CASES[who];dialog.classList.add('has-options');show('주인공 속마음',c['q'+q]);
  $('optionA').textContent=c['options'+q][0];$('optionB').textContent=c['options'+q][1];
  $('optionA').disabled=false;$('optionB').disabled=false;
 }
 else if(phase==='sequence'){
  show(...seq[i]);$('next').textContent=i===seq.length-1?(wrong?'설명 보기 ▾':'다음 ▾'):'다음 ▾';
 }
 else if(phase==='feedback'){
  dialog.classList.add('is-feedback');show('생각해 볼까요?','선택한 말을 다시 생각해 봐요.');
  $('feedback').textContent=CASES[who]['feedback'+q];$('next').textContent='다시 선택하기 ▾';
 }
 else if(phase==='return'){
  show('주인공 속마음','친구 이야기를 들어주고 함께 방법을 찾아봤어.');$('next').textContent='다음 ▾';
 }
 else if(phase==='end'){
  show(...END[i]);$('next').textContent=i===END.length-1?'엔딩 보기 ▾':'다음 ▾';
 }
 requestAnimationFrame(clip);
}
function startCase(which){if(done[which])return;who=which;phase='talk';i=0;render();}
function choose(answer){
 if(phase==='select'){startCase(answer==='A'?'doyun':'yuna');return;}
 if(phase==='question'){
   wrong=answer==='A';seq=CASES[who][(wrong?'wrong':'good')+q];
   seqEnd=wrong?'feedback':q===1?'question2':'complete';
   phase='sequence';i=0;render();
 }
}
$('optionA').addEventListener('click',()=>choose('A'));$('optionB').addEventListener('click',()=>choose('B'));
function next(){
 if(phase==='day'){phase='opening';i=0;render();}
 else if(phase==='opening'){if(++i>=OPEN.length){phase='select';i=0;}render();}
 else if(phase==='talk'){if(++i>=CASES[who].intro.length){phase='question';q=1;i=0;}render();}
 else if(phase==='sequence'){
  if(++i<seq.length){render();return;}
  i=0;
  if(seqEnd==='feedback')phase='feedback';
  else if(seqEnd==='question2'){phase='question';q=2;}
  else {done[who]=true;phase=(done.doyun&&done.yuna)?'end':'return';}
  render();
 }
 else if(phase==='feedback'){phase='question';render();}
 else if(phase==='return'){
  i=0;
  if(done.doyun&&done.yuna){phase='end';}else{phase='select';}
  render();
 }
 else if(phase==='end'){
  if(++i>=END.length){phase='finished';history.replaceState(null,'',location.pathname+location.search+'#ending');$('endScene').classList.add('visible');}else render();
 }
}
$('next').addEventListener('click',next);
function updateFinaleScale(){
 // The shared stage is already uniformly scaled by scene-responsive.js.
 // Use its untransformed CSS dimensions to prevent a second scale reduction.
 const scale=Math.min(stage.clientWidth/1600,stage.clientHeight/900);
 const board=$('finaleBoard');
 if(board)board.style.setProperty('--final-scale',String(scale));
}
window.addEventListener('resize',()=>{requestAnimationFrame(clip);updateFinaleScale()});window.visualViewport?.addEventListener('resize',()=>{requestAnimationFrame(clip);updateFinaleScale()});sprite.addEventListener('load',()=>requestAnimationFrame(clip));second.addEventListener('load',()=>requestAnimationFrame(clip));if(location.hash==='#ending'){$('endScene').classList.add('visible');phase='finished';}else{render();}updateFinaleScale();

<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>공용 만화책 | QR 현장 조사</title><style>
:root{color-scheme:dark;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#101722;overflow:hidden}body{display:grid;place-items:center;height:100dvh}.stage{position:relative;width:min(100vw,177.68dvh);aspect-ratio:1672/941;max-height:100dvh;overflow:hidden;background:#17222e;user-select:none;-webkit-user-select:none;cursor:pointer;touch-action:manipulation}.frame{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}.badge{position:absolute;top:2.5%;left:2.3%;padding:.65% 1.05%;border-radius:9px;background:#152035db;color:#fff;font-size:clamp(12px,1.7vw,24px);font-weight:800;z-index:3;pointer-events:none}.badge small{font-size:.55em;font-weight:600;color:#c3d8f9;margin-left:.45em}.progress{position:absolute;right:2.7%;top:2.7%;padding:.65% 1%;border-radius:9px;background:#152035d9;color:white;font-size:clamp(11px,1.2vw,17px);font-weight:700;z-index:3;pointer-events:none}.bubble{position:absolute;z-index:4;display:none;background:rgba(255,255,255,.98);color:#1b2029;border:2.5px solid #20242a;border-radius:38% / 40%;text-align:center;align-items:center;justify-content:center;line-height:1.45;font-size:clamp(12px,1.92vw,30px);font-weight:800;padding:1.6% 2%;filter:drop-shadow(1px 3px 3px #17171733);pointer-events:none;white-space:pre-line}.bubble.on{display:flex}.bubble.jiwoo{left:45.5%;top:19.5%;width:27.5%;height:24.5%}.bubble.jiwoo:after{content:"";position:absolute;right:-10%;bottom:7%;width:0;height:0;border-top:17px solid transparent;border-bottom:0 solid transparent;border-left:70px solid #20242a;transform:rotate(19deg)}.bubble.jiwoo:before{content:"";position:absolute;right:-8.5%;bottom:8.1%;width:0;height:0;border-top:12px solid transparent;border-left:58px solid white;z-index:1;transform:rotate(19deg)}.bubble.harin{left:60.5%;top:13%;width:31%;height:22%;border-radius:34% / 43%}.bubble.harin:after{content:"";position:absolute;left:-7%;bottom:7%;border-top:18px solid transparent;border-right:63px solid #20242a;transform:rotate(-14deg)}.bubble.harin:before{content:"";position:absolute;left:-5.5%;bottom:8%;border-top:13px solid transparent;border-right:52px solid white;transform:rotate(-14deg);z-index:1}.hint{position:absolute;bottom:3%;right:3%;background:#182239d9;border-radius:10px;color:white;padding:.9% 1.2%;font-size:clamp(12px,1.25vw,20px);font-weight:750;z-index:3;pointer-events:none}.end{position:absolute;z-index:30;inset:0;background:#0e151bc9;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;place-items:center;text-align:center;padding:30px;cursor:default;color:#fff}.end.open{display:grid}.endbox{max-width:780px;width:100%}.endbox h2{font-size:clamp(22px,3vw,42px);margin:0 0 12px}.endbox p{font-size:clamp(14px,1.6vw,22px);color:#e8edf3;line-height:1.6;margin:0 0 23px}.endbox button{font:inherit;font-size:clamp(14px,1.6vw,20px);background:#f7e3b9;color:#25231f;border:0;border-radius:12px;padding:.7em 2em;cursor:pointer}.endbox button:focus-visible{outline:3px solid #fff;outline-offset:4px}@media(max-width:650px){.badge small{display:none}.bubble{border-width:1.5px}.bubble.jiwoo:after{border-top-width:9px;border-left-width:32px}.bubble.jiwoo:before{border-top-width:6px;border-left-width:26px}.bubble.harin:after{border-top-width:9px;border-right-width:31px}.bubble.harin:before{border-top-width:6px;border-right-width:25px}.hint{bottom:2%}}
/* 구역1과 동일한 디지털 벽시계 위치/크기 */
.wallclock{position:absolute;left:72%;top:0.8%;width:10%;min-width:80px;height:auto;transform:translateX(-50%);pointer-events:none;z-index:2;filter:drop-shadow(0 2px 3px #0005)}
@media(max-aspect-ratio:9/8){.wallclock{left:73%;top:1.2%;width:16%;min-width:70px}}
</style></head><body><main class="stage" id="stage" role="button" tabindex="0" aria-label="이미지를 누르면 다음 장면으로 넘어갑니다"><img class="frame" id="frame" src="assets/scene_1.webp" alt="교실에서 만화책이 전달되는 첫 장면"><img class="wallclock" src="assets/digital_clock_0900.webp" alt="오전 9시 정각을 가리키는 교실 디지털 벽시계"><div class="badge">09:00 <small>사건 시각</small></div><div class="progress" id="progress">1 / 4</div><div class="bubble jiwoo" id="jiwoo">아... 촬영 기다리는 거 지루하다...<br>책이나 보자.</div><div class="bubble harin" id="harin">아... 공기가 안 좋네.<br>창문 열어야지.</div><div class="hint" id="hint">화면을 눌러 계속 ▶</div><section class="end" id="end" aria-live="polite"><div class="endbox"><h2>조사 완료</h2><p>관찰한 사실과 시각을 수사수첩에 기록해 주세요.<br>이 장면에서는 정답을 알려주지 않습니다.</p><button type="button" id="replay">다시 보기</button></div></section></main><script>
(()=>{'use strict';let i=0;const stage=document.getElementById('stage'),frame=document.getElementById('frame'),end=document.getElementById('end'),hint=document.getElementById('hint');const scenes=['assets/scene_1.webp','assets/scene_2.webp','assets/scene_3.webp','assets/scene_4.webp'];for(let n=1;n<scenes.length;n++){const img=new Image();img.src=scenes[n]}
function render(){frame.src=scenes[i];frame.alt=['지우가 책을 만지는 장면. 현우와 도윤은 흐리게 보인다.','현우가 지우의 만화책을 가져가는 장면','현우가 도윤에게 만화책을 전달하고 하린이 환기를 이야기하는 장면','하린이 지나간 뒤 세 학생의 모습이 드러나는 장면'][i];document.getElementById('progress').textContent=`${i+1} / 4`;document.getElementById('jiwoo').classList.toggle('on',i===0);document.getElementById('harin').classList.toggle('on',i===2);hint.textContent=i===3?'화면을 눌러 조사 완료 ▶':'화면을 눌러 계속 ▶';end.classList.remove('open')}
function next(){if(end.classList.contains('open'))return;if(i<scenes.length-1){i++;render()}else{end.classList.add('open');stage.setAttribute('aria-label','조사 완료, 다시 보기 버튼을 누르세요')}}stage.addEventListener('click',next);stage.addEventListener('keydown',e=>{if(!end.classList.contains('open')&&(e.key==='Enter'||e.key===' ')){e.preventDefault();next()}});document.getElementById('replay').addEventListener('click',e=>{e.stopPropagation();i=0;render();stage.setAttribute('aria-label','이미지를 누르면 다음 장면으로 넘어갑니다')});render()})();
</script></body></html>

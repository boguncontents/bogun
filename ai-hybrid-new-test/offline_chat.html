<style>
:root{font-family:'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;color:#1b324a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#e7f6ff,#eaf5e9);height:100vh;height:100dvh;display:grid;place-items:center}button,textarea{font:inherit}button{cursor:pointer}#app{width:min(960px,100%);height:min(740px,100dvh);min-height:300px;display:flex;flex-direction:column;background:rgba(255,255,255,.92);box-shadow:0 15px 48px #173b6630;overflow:hidden;border:3px solid #bfd9ea;border-radius:18px}header{background:linear-gradient(90deg,#12538a,#2874a8);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;min-height:60px}.headtitle{font-weight:850;font-size:clamp(16px,2.7vh,21px)}.headsub{font-size:12px;opacity:.9}#stage{margin-left:auto;font-size:clamp(12px,2vh,15px);font-weight:700}#log{flex:1;overflow:auto;padding:16px clamp(10px,3vw,24px);display:flex;flex-direction:column;gap:10px;background:linear-gradient(#f1f8fd,#e8f5fa)}.bubble{max-width:86%;border-radius:16px;padding:10px 14px;font-size:clamp(15px,2.5vh,19px);line-height:1.52;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 7px #a8c9da3b}.name{font-size:12px;font-weight:800;color:#56728d;margin-bottom:5px}.bubble.them{align-self:flex-start;background:#fff;border:1px solid #d9eaf5}.bubble.me{align-self:flex-end;background:#d0eac7;border:1px solid #a4d19d}.bubble.system{align-self:center;text-align:center;max-width:96%;background:#f7f9ff;color:#546678;font-size:clamp(13px,2.2vh,16px);border:1px dashed #a8c2df}.bubble.alert{background:#fff7e9;border:1px solid #e8c996;align-self:center;max-width:95%;color:#72511e}#controls{border-top:1px solid #cfdeec;background:#fff;padding:10px clamp(10px,2vw,20px);min-height:96px;display:flex;flex-direction:column;gap:8px}.compose{display:flex;gap:9px;align-items:stretch}.compose textarea{resize:none;flex:1;min-height:52px;max-height:80px;line-height:1.4;border:2px solid #b1cbdd;border-radius:11px;padding:9px 12px;font-size:clamp(15px,2.2vh,17px)}.compose button,.choice{padding:12px 15px;background:#14679c;border:0;color:#fff;border-radius:11px;font-weight:750;white-space:normal;text-align:center;font-size:clamp(14px,2.3vh,18px)}.choice{min-height:46px}.choice:hover,.compose button:hover{background:#0b517d}.choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.choices .choice{flex:1 1 150px}.tip{font-size:clamp(12px,1.8vh,14px);color:#526b7d}.error{color:#9c3440;font-size:clamp(13px,1.9vh,15px);font-weight:750;min-height:1.2em}#debug{position:fixed;z-index:5;right:8px;top:6px;max-width:min(320px,95vw);background:rgba(24,35,52,.90);color:#f8fafc;border-radius:10px;padding:8px 10px;white-space:pre-line;font-size:12px;pointer-events:none;display:none}.busy{opacity:.6;pointer-events:none}@media(max-height:550px){header{min-height:38px;padding:5px 12px}#log{padding:7px 12px;gap:6px}.bubble{padding:6px 10px}#controls{min-height:65px;padding:6px 10px;gap:4px}.compose textarea{min-height:42px}.choice{min-height:38px;padding:7px 9px}}
</style></head><body><div id="app"><header><div><div class="headtitle">🛡️ 디지털 안전 탐험대</div><div class="headsub">자유롭게 답하고, 안전한 선택을 연습해요</div></div><div id="stage"></div></header><main id="log" aria-live="polite"></main><footer id="controls"><div class="tip" id="hint">상황을 잘 읽고 답해 보세요.</div><div class="error" id="error"></div><div id="entry"></div></footer></div><div id="debug"></div>
<script>
// Original stable OfflineM1 classifier, unchanged
const OfflineM1 = (() => {
  const norm = raw => String(raw ?? '').toLowerCase().replace(/[“”‘’]/g, "'").trim();
  const tight = x => x.replace(/[\s.,!?~…·，。ㅋㅎㅠㅜㅡ\-_/\\'"()[\]{}:;]+/g,'');
  const has = (x, words) => words.some(w => x.includes(w));
  const looksTooShort = x => tight(x).length < 2;
  // 학생들이 자주 쓰는 비격식 거절 표현을 문맥에 맞춰 인식한다.
  // 특히 '시럽'은 일반 명사일 수도 있으므로 짧은 단독 거절에 한정한다.
  const denialOfRefusal = x => /(?:안싫|안시러|안실어|싫지않|싫지는않|싫진않|시러하지않|시르지않|시른게아니)/.test(tight(x));
  const slangRefusal = x => {
    const t=tight(x);
    if(denialOfRefusal(t)) return false;
    if(/(?:싫|시러|실어|실타|시른|시룬|시렁|시룽|시르|실허|시름|실음)/.test(t)) return true;
    return /^(?:아)?(?:나|난|나는)?(?:그건|그거|그런건|사진은|비밀은)?시럽(?:용|욤|임|이다)?$/.test(t);
  };
  const shortYes = x => /^(?:아)?(?:응+|어+|그래+|알겠어|알았어|오케이|ㅇㅋ|ㅇㅇ|좋아|그러자|할게|콜|네|넵|예|ㅇ+|ok|okay|yes)$/.test(tight(x));
  const shortNo = x => /^(?:ㄴ+|ㄴㄴ|노|노노|no|nope|싫|싫어|시러|안돼|안되|못해|아니|아니야|놉|안할래|안해|안함)$/.test(tight(x));
  const neg = x => has(x,['안 ','안보','안 보','안알','안 알','못','않','싫','시러','거절','하지 마','하지마','그만','말하지','안할','안 할','안해','안 해','ㄴㄴ','노노','비밀','알려주지','보내지','줄 수 없','줄수없']);
  // 실제 연령·학교명을 말하지 않는 학생 채팅 반문/말투를 상황별로 인정한다.
  // 단독 의미가 모호한 '어쩔', '킹받네', '헐'은 무조건 안전 판정하지 않는다.
  const slangBoundary = x => {
    const t=tight(x);
    if(/^(?:응)?(?:아니야|아닌데|아니거든|노노|놉|ㄴㄴ+)(?:요|용)?$/.test(t)) return true;
    return /(?:^|그건|그거|이건|그건좀)(?:진짜)?(?:에바|에바야|에바임|에바인데)(?:야|요|임)?$/.test(t)
      || /(?:^|그건|이건)(?:진짜)?(?:선넘네|선넘었네|선넘는다|선넘음|선넘지마)$/.test(t)
      || /^(?:(?:나이|학교|사진|사진은|그건|그거|이건)(?:은|는)?)?(?:노코멘트|패스|패쓰|패스요|패스할게|스킵|스킵할게|넘어가자|그건좀|이건좀|그건쫌)(?:요)?$/.test(t);
  };
  const privacyComeback = x => {
    const t=tight(x);
    return /(?:알아서|알면|알고|알아가지고|알아갖고|알아봤자|알아봐야)(?:뭐|머|어따|어디다|어디에|왜)/.test(t)
      || /(?:^|니가|네가|너가|넌|너는|님이)(?:그걸|그거|그게)?(?:뭐하려고|뭐하게|뭐할건데|뭐할껀데|머하게|머하려고|머할건데)/.test(t)
      || /(?:^|니|네|너|학교|나이|내나이|사진)(?:가|는|은|를)?(?:알빠|알바|알빠냐|알바냐)/.test(t)
      || /(?:^|그게|그거|그걸|내나이|내나이가|나이|학교)(?:뭔|먼|무슨)(?:상관|관계)/.test(t)
      || /^(?:뭔상관|먼상관|무슨상관|왜캐물어|왜자꾸물어|뭔데물어|알아서어쩌게|왜그래)(?:요)?$/.test(t);
  };
  const safeRefusal = x => shortNo(x) || has(x,[
    '말하기 싫','말하기시','말 안','말안','말 못','안 알려','안알려','못 알려','못알려','안 말','안말','안 가르쳐','안가르쳐','그건 비밀','비밀이지','비밀이야','나만 알','개인정보','굳이 알려','굳이 말','상관없잖','왜 물어','왜물어','왜 궁금','왜궁금','왜 알아','왜알아','왜 알려','왜알려',
    '너부터','넌 먼저','니가 먼저','네가 먼저','왜 말해야','왜말해야','답하고 싶지','답하기 싫','알려줄 이유','그런 건 안','그건 안','그거 안','얘기 안','얘기안','그런 건 못','궁금해 하지','질문하지마','질문 하지 마',
    '안 알랴','안알랴','안 알료','안알료','알랴주기 싫','알랴주기시','그만 물','그만물','물어보지마','물어보지 마','물어 보지마','물어 보지 마','물어보지말','물어 보지 말','묻지마','묻지 마','묻지말','묻지 말','더는 묻지마','더이상 물어보지마','싫다','싫어','시러','안 할래','안할래','안 할게','안할게'
  ]);
  const ageDetail = x => {
    const numbers = /(?:^|[^\d])(?:\d{1,3})\s*(?:살|세|학년)|(?:^|\s)(?:\d{1,3})(?:$|\s)|(?:나는|난|나이|내나이)\s*(?:는|가)?\s*\d{1,3}/.test(x);
    const words = /(?:열한|열두|열세|열네|열다섯|열여섯|열일곱|열여덟|열아홉|스무|스물|서른|마흔|쉰|백|열\s*[한두세네넷다섯여섯일곱여덟아홉])\s*(?:살|세)/.test(x);
    const grade = /(?:초|중|고)\s*[1-6]\s*(?:학년)?/.test(x);
    // 초등 고학년 채팅에서 '02년생'은 숫자 살 표현이 없더라도 출생연도형 응답.
    const birthYear=/(?:^|[^0-9])(?:0[0-9]|[12][0-9]|19[89][0-9]|20[012][0-9])\s*년생/.test(x);
    return numbers || words || grade || birthYear;
  };
  const schoolDetail = x => {
    // '우리 학교는 비밀' 같은 문구가 아닌 실제 학교명 표기(서울OO초, OO초등학교 등)
    const schoolName = /(?:[가-힣a-z0-9]{2,25})\s*(?:초등학교|중학교|고등학교|초교|초등|초)(?:\s|$|[은는이다야라고다.,!?~])/.test(x);
    const disclosed = /(?:다니는\s*학교(?:는|가)?|학교\s*이름(?:은|이)?|우리\s*학교(?:는|가)?)\s*[가-힣a-z0-9]{2,}(?:초|학교|초등학교)/.test(x);
    return schoolName || disclosed;
  };
  const photoDisclosure = x => {
    const t=tight(x);
    // 거절 단어를 섞어 놓고 뒤에서 전송에 동의했다면 통과시키지 않는다.
    const clearPromise=/(?:보내줄게|보내줄께|보낼게|보내겠어|보내겠다|보낼거야|보낼래|보내볼게|보내볼래|보내드릴게|보여줄게|보여줄께|보여줄거야|사진줄게|사진줄께|사진줄거야|사진줄래|찍어줄게)/.test(t);
    const directNo=/(?:안|못|절대안)(?:사진(?:을|은)?)?(?:보낼|보내|보여|줄)|(?:보내|전송|보여)지(?:않|안)|(?:보내|전송|보여)기(?:싫|시러|실어)/.test(t);
    if(clearPromise && (!directNo || /(?:근데|그런데|그래도|하지만|결국|암튼|어쨌든|걍|그냥)(?:나)?(?:사진)?(?:보내|보여|찍|줄)/.test(t))) return true;
    // 강한 거절이 있다면 질문에 등장한 '사진/보내기' 단어만으로 동의로 오해하지 않는다.
    if(slangRefusal(x) && !clearPromise) return false;
    const yes=shortYes(x);
    // '왜 사진을 보내야 해?'는 전송 동의가 아닌 요구를 되묻는 표현이다.
    if(/왜\s*(?:사진|셀카|얼굴).*?(?:보내|보여|찍)/.test(x) && !/보내(?:줄게|겠다|겠어)/.test(x)) return false;
    const verb=/(?:사진|셀카|얼굴|이미지|내사진).*(?:보내|줄게|줄께|보여|찍어)|(?:보내|전송|공유|보여|찍어).*(?:사진|셀카|얼굴)/.test(x);
    const positive=has(x,['보낼게','보내줄게','보내줄께','보내드릴','전송할','찍어서 보낼','찍어 보낼','보여줄게','보여줄께','사진 줄게','사진줄게','사진 줄께','줄게','보내도 돼','보내도돼']);
    return (yes || verb || positive) && !((!yes) && (neg(x)||has(x,['안 보낼','안보낼','보내지 않','보내기 싫','사진은 안','사진 안','안 찍','안찍','보여주기 싫'])));
  };
  // '못생겨서 안돼'처럼 이유를 붙여 부드럽게 거절하는 표현도 인정한다.
  // 단순 외모 평가는 판정 기준이 아니며, 핵심은 사진을 제공하지 않겠다는 뜻이다.
  const photoSoftNo = x => {
    const t=tight(x);
    return /(?:안돼|안되|안대|안됨|안됌|안되지|안될듯|안될것같|못하겠|부담스러|부담돼|민망해|민망해서|그건좀|이건좀)/.test(t);
  };
  // 사진 재요구에도 첫 질문과 동일한 거절 판정을 적용한다.
  const photoCantView = x => /(?:너|니|네|님|너도|니도)?(?:절대)?(?:못봄|못봐|못보지|못볼걸|못보여|안보여줄|안보여줌)/.test(tight(x));
  const photoRefusal = x => shortNo(x) || slangRefusal(x) || slangBoundary(x) || photoSoftNo(x) || photoCantView(x) || rejectDemand(x) || has(x,[
    '안 보내','안보내','안 보낼','안보낼','못 보내','못보내','보내지 않','보내지 마','보내기 싫','보내기시','사진은 안','사진 안','사진안','안 찍','안찍','안 보여','안보여','보여주기 싫','보여주지 않','얼굴 안','얼굴은 안','싫어','시러','싫다','거절','그만','요구하지 마','요구하지마','왜 자꾸 물어','왜자꾸물어','왜 사진','왜사진','왜 필요','왜필요','사진은 비밀','사진 비밀','보낼 이유','사진 못','사진못','그건 안','안 할래','안할래','보내면 안 돼','보내면안돼','사진 안됨','사진안됨','물어보지마','물어보지 마','물어보지말','묻지마','묻지 말','궁금해하지마','궁금해하지 마','궁금하지마','궁금해 하지마','사진요구하지마','사진요구하다니'
  ]);
  // 비밀 요구 단계: '다른 사람에게 말하지 않겠다'와 '어른에게 말하겠다'를 구별한다.
  // 띄어쓰기, 짧은 구어체, 활용형을 함께 판정한다.
  const secretConsent = x => {
    const t=tight(x);
    if(shortYes(x)) return true;
    if(/(?:비밀로하자|비밀로할게|비밀을지켜|우리끼리만)(?:라는|라고|라니|란|는말|는거|고해서|는것)/.test(t)
      && /(?:수상|찝찝|이상|거절|안돼|안할|싫|왜|그만|잘못)/.test(t)) return false;
    // 비밀 유지 약속이 분명하면 막는다. ('말할 거야'와 '말 안 할 거야'는 다르다.)
    const keepPromises=[
      '비밀로할게','비밀로할께','비밀로하자','비밀로해줄게','비밀지킬게','비밀지킬께','비밀지킬래',
      '비밀지켜줄게','우리끼리만알자','둘만의비밀로하자','우리만알자',
      '말안할게','말안할께','말안할거야','말안할래','말하지않을게','말하지않을거야',
      '얘기안할게','얘기안할거야','아무한테도안말할게','아무한테도말안할게',
      '아무한테도말안할거야','아무한테도얘기안할게','아무한테도알리지않을게',
      '선생님한테말안할게','선생님께말안할게','부모님한테말안할게','엄마한테말안할게',
      '절대말안할게','절대말안할거야','비밀꼭지킬게'
    ];
    if(keepPromises.some(w=>t.includes(w))) return true;

 if(stage.startsWith('m1_')&&/(?:너|님|니|넌)?(?:사기꾼|범죄자|수상한사람|경찰에신고)(?:이지|아니야|냐|니|야|임|임까)?$/.test(t))return {status:'safe',reason:''};
 if(stage==='m1_pressure'&&/^(?:안넘어감|안속음|못믿어|절대안믿어|안통해)$/.test(t))return {status:'safe',reason:''};
 if(stage==='m2_help'){
  // This stage is about capturing the conversation, NOT the victim's image.
  if(!/(?:사진|지우|피해|안할|못할|하지마|말자|안해|하지않)/.test(t) && (
    /^(?:당장)?(?:대화)?(?:캡처|캡쳐|스샷|스크린샷)(?:각|해야지|하겠어|할거야|할게|ㄱㄱ|고고)?$/.test(t)
    ||/^(?:당장)?(?:캡처|캡쳐)(?:해서|해두고)(?:신고|보여주|알릴|증거)/.test(t)
  ))return {status:'safe',reason:''};
 }
 if(stage==='m2_reject'&&/(?:지우한테|지우에게|당사자에게|피해친구에게)(?:바로)?(?:말해야지|말할게|알려야지|알릴게|알려주자)$/.test(t))return {status:'safe',reason:''};
 if(stage==='m1_secret'&&/(?:캡쳐|캡처|대화기록|스샷|스크린샷).{0,12}(?:신고|선생님|어른|경찰)|(?:신고|경찰).{0,8}(?:ㄱㄱ|해야지)/.test(t))return {status:'safe',reason:''};
 return r||{status:'unclear',reason:'이 상황에서 어떻게 대처할지 다시 생각해 보세요.'};
}
const aiResponse=(data)=>{const v=String(data?.result||'').toUpperCase();if(v==='SAFE')return {status:'safe',reason:''};if(v==='UNSAFE')return {status:'unsafe',reason:String(data.feedback||data.reason||'안전한 방법으로 다시 답해 보세요.')};if(v==='RETRY')return {status:'unclear',reason:String(data.feedback||data.reason||'조금 더 분명하게 답해 보세요.')};return null;};
async function decide(stage,text){let r=localVerdict(stage,text);if(r.status==='safe'||r.status==='unsafe'){postDiagnostic(stage,'local',0,0,0,r.status);return r;}
 // The Worker version available to us did not advertise a supported m1_secret scene. Never silently swap stages.
 if(!apiMap[stage]){postDiagnostic(stage,'fallback',0,0,0,'worker-stage-not-confirmed');return {status:'fallback'};}
 if(Date.now()<blockedUntil){postDiagnostic(stage,'fallback',0,429,0,'quota-cooldown');return {status:'fallback'};}
 let controller=new AbortController();let clock=setTimeout(()=>controller.abort(),AITIMEOUT);let st=Date.now(),status=0;
 try{const data={scene_id:apiMap[stage],npc_message:scenes[mission][step].pre.at(-1)[1],student_message:text};let res=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),signal:controller.signal});status=res.status;
  if(!res.ok){if([429,502,503].includes(status))blockedUntil=Date.now()+30000;postDiagnostic(stage,'fallback',Date.now()-st,status,1,'http-'+status);return {status:'fallback'};}
  let parsed=await res.json();let x=aiResponse(parsed);if(!x){postDiagnostic(stage,'fallback',Date.now()-st,status,1,'invalid-result');return {status:'fallback'};}
  postDiagnostic(stage,'api',Date.now()-st,status,1,x.status);return x;
 }catch(e){postDiagnostic(stage,'fallback',Date.now()-st,status,1,e.name==='AbortError'?'timeout':'network');return {status:'fallback'};}finally{clearTimeout(clock);}
}
function fallback(stage){notice('AI 연결이 잠시 원활하지 않아요. 안전한 대응을 선택해 계속할 수 있어요.');el.hint.textContent='아래 보기 중 한 가지를 골라 다음 대화로 진행해요.';makeButtons(fallbackChoices[stage].map(v=>[v,()=>{bubble('주인공',v);postFallbackContinue();}]));}
function postFallbackContinue(){nextStage();}
function compose(){const c=scenes[mission][step];el.stage.textContent='MISSION '+(mission==='m1'?'1':'2')+' · '+(step+1)+' / '+scenes[mission].length;el.hint.textContent='✏️ '+c.prompt+' (90자 이내)';clearEntry();const row=document.createElement('div');row.className='compose';const input=document.createElement('textarea');input.rows=2;input.maxLength=90;input.placeholder='내 생각을 직접 입력해 보세요';const button=document.createElement('button');button.type='button';button.textContent='전송';row.append(input,button);el.entry.appendChild(row);button.onclick=async()=>{if(busy)return;const text=input.value.trim();const problem=validate(text);if(problem){el.error.textContent=problem;return;}busy=true;row.classList.add('busy');el.error.textContent='답변을 확인하는 중…';const verdict=await decide(c.id,text);busy=false;row.classList.remove('busy');el.error.textContent='';if(verdict.status==='safe'){bubble('주인공',text);nextStage();}else if(verdict.status==='unsafe'){el.error.textContent=verdict.reason||'안전한 말로 다시 써 보세요.';input.focus();}else if(verdict.status==='fallback'){bubble('주인공',text);fallback(c.id);}else{el.error.textContent=verdict.reason||'자신의 생각을 조금 더 분명하게 써 보세요.';input.focus();}};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();button.click();}};}
function nextStage(){step++;if(step<scenes[mission].length){showStage();return;} if(mission==='m1'){bubble('시스템','온라인 친구의 부적절한 요구가 이어졌습니다.');makeButtons([['📸 대화 캡처하기',()=>{bubble('주인공','📸 대화 기록을 남겼어요.');bubble('게임 친구','어, 오늘 내가 좀 많이 물어봤나? ㅎㅎ 그래도 우리 친구지? 이따 게임에서 만나!');makeButtons([['🚫 상대방 차단하기',()=>{bubble('주인공','🚫 상대방을 차단했어요.');finish();}]]);}]]);}else{bubble('민준','야, 진짜 짜증 나네! 너 혼자 잘난 척하지 마!');makeButtons([['📸 대화 캡처하기',()=>{bubble('주인공','📸 대화 기록을 남겼어요.');finish();}]]);}}
function finish(){el.hint.textContent='이 활동을 완료했어요.';makeButtons([['다음 장면으로 이동',()=>{window.parent.postMessage({type:'DS_AI_FINISH',mission:mission==='m1'?1:2},'*');}]]);}
function showStage(){const c=scenes[mission][step];for(const [name,message] of c.pre)bubble(name,message);compose();}
function start(m){mission=m===1?'m1':'m2';step=0;busy=false;el.log.innerHTML='';el.entry.innerHTML='';el.error.textContent='';el.stage.textContent='';showStage();}
window.addEventListener('message',event=>{if(event.source!==window.parent||!event.data||event.data.type!=='DS_AI_START')return;start(Number(event.data.mission));});
// Expose a read-only test entry through debug mode; no extra API calls.
if(DEBUG){window.__DS_TEST__={classify:localVerdict,apiMap,scenes,build:BUILD};el.debug.style.display='block';el.debug.textContent=BUILD+'\n테스트 대기중';}
bubble('시스템','게임 화면에서 채팅 시작을 기다리는 중이에요.');
})();

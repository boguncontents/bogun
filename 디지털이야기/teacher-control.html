<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>디지털 안전 이야기 · 교사용 수업 관리</title>
<style>:root{font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#172b44;background:#edf3fa}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px}.panel{width:min(520px,100%);padding:30px;background:white;border-radius:22px;box-shadow:0 15px 55px #142f4d22}h1{font-size:1.5rem;margin:0 0 7px}p{line-height:1.6;color:#546477}.state{background:#eff4f8;border-radius:15px;padding:18px;margin:22px 0;font-weight:750;text-align:center;font-size:1.2rem}label{display:block;margin:18px 0 7px;font-weight:700}input{width:100%;height:48px;padding:12px;border:1px solid #afbbc9;border-radius:12px;font-size:1rem}button{border:0;border-radius:12px;padding:14px 12px;font-size:1rem;font-weight:750;cursor:pointer}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.on{background:#d8f6e4;color:#155c36}.off{background:#ffe5de;color:#873222}.refresh{background:#f2f4f7;margin-top:12px;width:100%}#info{font-size:.91rem;min-height:1.5em;color:#37495f}small{display:block;margin-top:16px;color:#677b90;line-height:1.5}</style></head>
<body><main class="panel"><h1>우리들의 디지털 안전 이야기</h1><p>교사용 수업 운영 · Gemini API 호출 관리</p><div class="state" id="state">현재 상태 확인 중…</div><label for="password">관리자 비밀키 (ADMIN_TOKEN)</label><input type="password" id="password" autocomplete="off" placeholder="Cloudflare에 등록한 비밀키"><div class="buttons"><button class="on" id="on">수업 ON</button><button class="off" id="off">수업 OFF</button></div><button class="refresh" id="refresh">상태 새로 확인</button><p id="info" role="status" aria-live="polite"></p><small>비밀키는 페이지·브라우저 저장소에 저장하지 않습니다. 수업 종료 후 OFF로 설정하면 새로운 Gemini 요청을 거부하도록 설계했습니다. KV 특성상 전 세계 서버에 상태가 반영되기까지 지연이 생길 수 있습니다.</small></main>
<script>
'use strict';
const WORKER='https://digital-safety-ai.choijihey.workers.dev';
const $=id=>document.getElementById(id);
async function refresh(){try{const r=await fetch(WORKER+'/status',{cache:'no-store'});if(!r.ok)throw new Error('상태 확인 실패: '+r.status);const obj=await r.json();$('state').textContent=obj.enabled?'● 수업 ON · Gemini 요청 허용':'● 수업 OFF · Gemini 요청 차단';$('info').textContent='상태를 확인했습니다.';}catch(e){$('state').textContent='상태 확인 불가';$('info').textContent='Worker 코드 배포 및 인터넷 연결을 확인해 주세요.';}}
async function setState(enabled){const token=$('password').value;if(!token){$('info').textContent='관리자 비밀키를 입력해 주세요.';return;}if(!confirm(enabled?'수업을 ON으로 전환할까요?':'수업을 OFF로 전환하고 새로운 Gemini 요청을 차단할까요?'))return;for(const b of [$('on'),$('off')])b.disabled=true;try{const r=await fetch(WORKER+'/admin/control',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({enabled}),cache:'no-store'});const obj=await r.json().catch(()=>({}));if(!r.ok)throw new Error(obj.error||('요청 실패: '+r.status));$('info').textContent=enabled?'수업 ON을 저장했어요.':'수업 OFF를 저장했어요.';await refresh();}catch(e){$('info').textContent=e.message;}finally{for(const b of [$('on'),$('off')])b.disabled=false;}}
$('on').addEventListener('click',()=>setState(true));$('off').addEventListener('click',()=>setState(false));$('refresh').addEventListener('click',refresh);refresh();
</script></body></html>
